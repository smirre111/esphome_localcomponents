    id: rol_1_macping_gaps
    entity_category: diagnostic
    update_interval: 30s
    accuracy_decimals: 0
    lambda: 'return (float) id(rol_1)->mac_stats().echo_seq_gaps;'

  # HW-9, hub half. The node half closed from the ModeTest report (tick 100 Hz);
