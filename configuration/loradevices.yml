substitutions:
  devicename: "loradevices"



esphome:
  name: $devicename
  # Example configuration entry

  # comment: "MyBlinds"
  # name_add_mac_suffix: true
  # project:
  #   name: "Blinds"
  #   version: "V0.1"

esp32:
  variant: esp32
  cpu_frequency: 240MHz
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_XTAL_FREQ_26: y
      CONFIG_INT_WDT_TIMEOUT_MS: "800"
      CONFIG_FREERTOS_CHECK_STACKOVERFLOW_CANARY: y
      CONFIG_FREERTOS_WATCHPOINT_END_OF_STACK: y
      # Pinned, not inherited. The transmit burst paces itself with
      # vTaskDelayUntil(pdMS_TO_TICKS(88)), and pdMS_TO_TICKS quantises to the
      # tick: at 1000 Hz that is 88 ms, at 100 Hz it is 80 ms, and an 8 ms
      # per-copy error is 9 % of the stride the node's DriftEstimator regresses
      # against. Nothing in this file previously said what the rate was, so the
      # stride was correct only by inheritance from a default.
      CONFIG_FREERTOS_HZ: "1000"
      # PSA Crypto is called from the ESPHome loop (session key install/destroy,
      # uplink verify), from the tracker's send task (per-copy burst retag) and
      # from esp_timer callbacks (MAC pings). Without mbedTLS threading, PSA's
      # global key-slot state is unguarded across those tasks: a re-login that
      # destroys a key mid-burst could race a psa_mac_compute on the send task.
      # (lora_client.cpp additionally holds s_session_keys_mutex across the use
      # of a session key, so the key cannot be destroyed under the call.)
      CONFIG_MBEDTLS_THREADING_C: y
      # ALT is the Kconfig default once THREADING_C is on, but ESP-IDF ships no
      # alt implementation and check_config.h forbids ALT together with PTHREAD
      # ("MBEDTLS_THREADING_ALT defined, but not all prerequisites" - seen on
      # IDF 5.5.2), so ALT is switched off and the pthread backend is used.
      CONFIG_MBEDTLS_THREADING_ALT: n
      CONFIG_MBEDTLS_THREADING_PTHREAD: y
      # Keep the panic handler in IRAM so a crash while the flash cache is off
      # (an NVS write on the other core) still produces a backtrace instead of
      # a silent interrupt-watchdog reset.
      CONFIG_ESP_PANIC_HANDLER_IRAM: y
    # advanced:
    #   loop_task_stack_size: 16384
  
preferences:
  flash_write_interval: 30min    

external_components:
  # use all components from a local folder
  - source:
      type: local
      path: local_components

# Enable logging
logger:


# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  platform: esphome
  password: !secret esphome_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: .fritz.box
  fast_connect: on

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${devicename}-AP"
    password: !secret wifi_ap_password

captive_portal:

# see: https://esphome.io/components/time.html
time:
  - platform: homeassistant
    id: homeassistant_time
    on_time:
      - seconds: 0
        minutes: 0
        hours: 23
        days_of_week: MON-SUN
        then:
          - loracover.on_sleep_start: rol_1
          # RESTORED 2026-09-20 — the Mode B MAC-0 campaign that disabled this
          # (cfbe988) has ended.
          #
          # READ BEFORE STARTING A LONG BENCH RUN: this fires at 23:00 and deep
          # sleeps the bench node mid-run. It killed a 900 s Mode B run at 869 s
          # on 2026-09-14 and the run reported nothing. Start long runs with
          # enough margin before 23:00, or comment this line out again for the
          # duration and restore it afterwards.
          - loracover.on_sleep_start: rol_2



# Enable Web server
web_server:
  port: 80
  auth:
    username: !secret web_server_username
    password: !secret web_server_password


lora_tracker:
  id: my_lora_tracker
  fleet_key: !secret lora_fleet_key


lora_client:
  - id: rol_1
    name: "RollladenWohnzimmer1"
    time_id: homeassistant_time
    short_address: 17
    subnet_address: 02
    sleep_duration: 21600
    battery_update_interval: 15min
    mac_address: e0:8c:fe:5f:b7:a4
    # P4: automatic (scheduled) mode.
    #
    # Back to FALSE (interactive) as the seed. Auto mode has been proven in
    # production (21:45 close and 06:00 open both fired), but a node in auto
    # mode SLEEPS, and a sleeping node cannot be reached for an OTA or a drift
    # test without a physical button press at the blind. Interactive is the
    # right default while the drift work is in progress.
    #
    # NOTE: this is only the FIRST-BOOT seed. Once a schedule has been stored,
    # load_schedule_() restores the persisted mode and logs "YAML seed
    # ignored" — so changing this line does NOT flip a hub that already has
    # AUTO in flash. Use the Auto Mode switch in HA for that.
    auto_mode: false
    interactive_timeout: 30min
    checkin_interval: 6h
    catchup_window: 0min
    schedule:
      - time: "06:00:00"
        days: weekdays
        action: open
      - time: "07:30:00"
        days: weekend
        action: open
      - time: "21:45:00"
        days: daily
        action: close
      # - time: "12:00:00"
      #   days: sat
      #   action: position
      #   position: 40


  - id: rol_2
    name: "RollladenWohnzimmer2"
    time_id: homeassistant_time
    short_address: 18
    subnet_address: 02
    sleep_duration: 21600
    battery_update_interval: 15min
    mac_address: e0:8c:fe:5f:9e:c4
    # ---- node 2, bench unit ----
    # The auto-mode trial succeeded here (both scheduled events fired).
    #
    # Seeded INTERACTIVE: this is the node the drift test runs on, and the test
    # needs it awake and listening. See the note on node 1 — this seed is
    # ignored once a schedule is stored, so the HA switch is the live control.
    auto_mode: false
    interactive_timeout: 30min
    # 1 h rather than node 1's 6 h: this is the BENCH unit, and a check-in is
    # the only way to observe a wake end to end. Six hours between samples made
    # every protocol change a next-day question.
    #
    # Affordable because of the sleepOk flag: a check-in wake costs ~7.7 s
    # instead of 28 s, so hourly is 185 s/day of awake time against six-hourly's
    # 112 s. Before that change it would have been 672 s. See
    # docs/wake-cost-proposal.md.
    #
    # Node 1 deliberately stays at 6 h — it has no serial, so it cannot provide
    # the observability this spends battery on, and its pack is the weaker one.
    #
    # BACK TO 1h (2026-09-19). The 15 min pace was for the Mode C MAC-0
    # measurement: every check-in is one wake-clock sample and one Class A
    # funnel report, so four times the data per hour, at ~290 s awake per day
    # against hourly's 185 s. MAC-0 is now measured in all three modes (A, B
    # and C all pass; Mode B on fw 1.0.95 lost 0 of 598 marks), so the extra
    # sample rate no longer buys anything and the battery cost stops.
    #
    # The MODE stays interactive (auto_mode: false above, and the HA Auto Mode
    # switch off). Interval and mode are independent: an interactive node is
    # awake and reachable, which is what the remaining bench work needs — this
    # change only slows the check-in cadence, it does not let the node sleep.
    # BACK TO 15min, 2026-09-22 — and yes, this is the second time it has moved.
    # Restored to 1h when the campaign "concluded", then straight back, because
    # that conclusion was wrong: only Modes A and B were re-run on fw 1.1.4.
    # Mode C's FUNCTION was never established on the shipped build, and its ppm
    # being low priority is not the same thing as Mode C being low priority.
    #
    # Each check-in is one Mode C sample: a wake, a session resume, an applied
    # sleep to compare against the request, and a Class A funnel. At 1h, four
    # samples cost four hours; at 15min, about seventy minutes. Interval length
    # barely affects the four things being established (wakes heard, resume=1,
    # applied ~= requested, true FER) — the one thing that scales with sleep
    # duration is clock drift, which is the deprioritised ppm.
    #
    # RESTORE TO 1h once Mode C is established. The reasoning for 1h is directly
    # above and unchanged: 15 min costs ~290 s awake per day against hourly's
    # 185 s.
    #
    # RESTORED TO 1h (2026-09-22 09:27). The 5 min setting was temporary, the
    # campaign it was for is CONCLUDED, and it has been removed as promised —
    # 5 min was the highest awake-time setting used on this bench.
    #
    # What it bought, running 07:31–09:27 behind the Class A ledger:
    #
    #   offered 20 | windows 29 | hits 19 | detected 21 | crcValid 21
    #   true FER 0 of 21, against n 5 from the entire 80 min 15 min run
    #
    # Steady state was +1 offered / +1 window / +1 hit / +1 detected /
    # +1 crcValid per check-in, without exception, for the 16 samples from
    # 08:02 to 09:27. The single miss (19 hits against 20 offers) and 8 barren
    # windows both belong to the ONE interval-transition wake at 07:56.
    checkin_interval: 1h
    catchup_window: 0min
    # Two events eight minutes apart so one run observes both a first entry
    # into auto mode AND a wake out of deep sleep with the RTC markers already
    # valid — which is the case the boot forensics were added to read.
    schedule:
      - time: "21:45:00"
        days: daily
        action: close
      - time: "06:00:00"
        days: daily
        action: open

#mac_address: c4:9e:5f:fe:8c:e0


cover:
  - platform: loracover
    lora_client_id: rol_1
    name: "RollladenWohnzimmer1"
    id: rol_1_cover
    invert_position: false
    # Bar-travel-only times (top <-> sill). Slats nest/un-nest at the sill:
    #   open_slack  = un-seal run before travel when opening from fully closed
    #   close_slack = seal run budget after travel reaches 0 on a full close
    # Starting estimates — recalibrate with a stopwatch.
    open_duration: 65
    close_duration: 55
    open_slack: 7
    close_slack: 7
    blind_height_mm: 2000.0
    axle_diameter_mm: 60.0
    blind_thickness_mm: 8.0

  - platform: loracover
    lora_client_id: rol_2
    name: "RollladenWohnzimmer2"
    id: rol_2_cover
    invert_position: false
    open_duration: 42
    close_duration: 38
    open_slack: 7
    close_slack: 7
    blind_height_mm: 2000.0
    axle_diameter_mm: 60.0
    blind_thickness_mm: 8.0



button:
  - platform: restart
    name: "Hub Restart"
    id: hub_restart
  - platform: loracover
    lora_client_id: rol_1
    name: "Trigger OTA1"
    id: rol_1_trigger_ota_button
    # type: trigger_ota
  - platform: loracover
    lora_client_id: rol_2
    name: "Trigger OTA2"
    id: rol_2_trigger_ota_button
    # type: trigger_ota

  # ---- Runtime debug toggles (DebugFlags.h, node repo, 2026-09-29) --------
  # No reflash needed: these flip a persisted flag on the node over LoRa.
  # idle_current_on/off is sticky (survives reboot); trace_capture_arm is a
  # one-shot that disarms the current-sense endstop for exactly the next full
  # open/close so its whole current trace can be read back -- it self-clears,
  # so it must be pressed again before every capture. Node 1 is field-only
  # (no serial), so this is the only way to run these captures on it at all.
  - platform: loracover
    lora_client_id: rol_1
    name: "RollladenWohnzimmer1 Debug Idle Current ON"
    id: rol_1_debug_idle_current_on
    op: idle_current_on
  - platform: loracover
    lora_client_id: rol_1
    name: "RollladenWohnzimmer1 Debug Idle Current OFF"
    id: rol_1_debug_idle_current_off
    op: idle_current_off
  - platform: loracover
    lora_client_id: rol_1
    name: "RollladenWohnzimmer1 Debug Trace Capture Arm"
    id: rol_1_debug_trace_capture_arm
    op: trace_capture_arm
  - platform: loracover
    lora_client_id: rol_2
    name: "RollladenWohnzimmer2 Debug Idle Current ON"
    id: rol_2_debug_idle_current_on
    op: idle_current_on
  - platform: loracover
    lora_client_id: rol_2
    name: "RollladenWohnzimmer2 Debug Idle Current OFF"
    id: rol_2_debug_idle_current_off
    op: idle_current_off
  - platform: loracover
    lora_client_id: rol_2
    name: "RollladenWohnzimmer2 Debug Trace Capture Arm"
    id: rol_2_debug_trace_capture_arm
    op: trace_capture_arm

  # --- Clock-drift characterisation (bench only) ---------------------------
  # Puts both ends into test mode: the node holds continuous RX, the hub emits
  # a burst every 15 s as a regular ruler. The node then regresses the arrival
  # times of the 17 copies against their known 88000 us spacing; the slope is
  # the relative drift.
  #
  # 88000, NOT 1500/17 = 88235. This comment said 88235 and that is the exact
  # error that cost three firmware revisions: the hub's stride is
  # `roundDurationMs / txSlotsPerRound` in C++ integer arithmetic, so it is 88
  # ms exactly, and the node compiles kCopySpacingUs = 88000 to match. A ruler
  # believed to be 88235 against copies actually 88000 apart reads as a
  # -2663 ppm clock error that does not exist. Result appears in the node's serial log as
  # "DriftTest result: +N ppm over M bursts".
  #
  # Continuous RX costs ~11 mA against the ~1.2 mA interactive average, so this
  # is NOT something to leave running. Both ends stop themselves after 5 min,
  # and the node's timeout is independent of the hub — if the hub goes away
  # mid-test the node still exits.
  # - platform: template
  #   name: "Drift Test Start (node 2)"
  #   id: rol_2_drift_start
  #   entity_category: diagnostic
  #   on_press:
  #     # 1100 ms, deliberately NOT a multiple of the node's 500 ms RX interval.
  #     # Commensurate periods phase-lock: a 1000 ms grid against 500 ms windows
  #     # keeps a constant phase relationship, so if a frame starts landing in the
  #     # node's RX-off gap it does so forever. Observed exactly that — ~300 grid
  #     # frames heard, zero. Belt and braces: the node is in continuous RX by the
  #     # time the grid starts, so this should not matter.
  #     - lambda: 'id(rol_2)->start_drift_test(300, 1100);'
  # - platform: template
  #   name: "Drift Test Stop (node 2)"
  #   id: rol_2_drift_stop
  #   entity_category: diagnostic
  #   on_press:
  #     - lambda: 'id(rol_2)->stop_drift_test();'

  # # --- ModeTest: on-hardware validation of a mode (test-plan.md section 10) ---
  # #
  # # Distinct from the drift test above, which measures ONE thing (relative clock
  # # rate) with the power profile disabled. ModeTest runs under the PRODUCTION
  # # profile by default and reports the frame funnel, the window decisions and
  # # four timing distributions, so a mode's claims can be checked against the
  # # mode as it actually ships. The report is logged by the hub, recomputed from
  # # the node's RAW counters — the node never gets to grade itself.
  # #
  # # The node refuses to arm without a session, refuses MODE_SWEEP unless it is
  # # flagged as a bench node, and owns its own deadline: if the hub disappears
  # # mid-test the node still exits and restores everything, its MODE included.
  # #
  # # Arguments: (duration_s, grid_ms, mode, copies, keepPowerProfile,
  # #             enableCounter, enableCrypto, macEcho, armOffsetUs)
  # # mode: 0 leave alone, 1 A, 2 B, 3 C, 4 SWEEP.
  # - platform: template
  #   name: "Mode Test A — MAC-0 baseline (node 2)"
  #   id: rol_2_modetest_a
  #   entity_category: diagnostic
  #   on_press:
  #     # 1093 ms, NOT 1100. MEASURED 2026-09-12: at 1100 ms the hub sent 277
  #     # marks and the node detected ONE. Phase-locking is governed by the gcd,
  #     # not by divisibility — marks land at (k * grid) mod 500, a lattice of
  #     # step gcd(grid, 500) that never grows. 1100 gives gcd 100 ms, i.e. five
  #     # fixed phases forever; against a 29.44 ms window they cover 147 ms of
  #     # the 500 ms interval, so ~71 % of runs hear nothing at all and the rest
  #     # hear 1 mark in 5. 1093 gives gcd 1 ms: the phase walks 93 ms per mark
  #     # and sweeps every residue. The node now REFUSES the phase-locked case
  #     # (ModeTestPolicy.h periodsPhaseLock) instead of measuring an empty
  #     # denominator.
  #     #
  #     # Both sublayers off and macEcho on: this is the baseline every other run
  #     # is a delta against. A MAC echo measures RxDone -> TX fire and nothing
  #     # else, which is what section 4.3's servable-slot rule needs and cannot
  #     # get from a command the application answers.
  #     - lambda: 'id(rol_2)->start_mode_test(300, 1093, 1, 1, true, false, false, true);'
  # - platform: template
  #   name: "Mode Test A — with MAC-1 counter (node 2)"
  #   id: rol_2_modetest_a_counter
  #   entity_category: diagnostic
  #   on_press:
  #     # Identical grid, counter ON. The DIFFERENCE against the baseline is
  #     # MAC-1's cost — measured, not estimated. Run them back to back.
  #     - lambda: 'id(rol_2)->start_mode_test(300, 1093, 1, 1, true, true, false, true);'
  # - platform: template
  #   name: "Mode Test A — with MAC-1 + MAC-2 (node 2)"
  #   id: rol_2_modetest_a_crypto
  #   entity_category: diagnostic
  #   on_press:
  #     - lambda: 'id(rol_2)->start_mode_test(300, 1093, 1, 1, true, true, true, true);'
  # - platform: template
  #   name: "Mode Test B — timed windows (node 2)"
  #   id: rol_2_modetest_b
  #   entity_category: diagnostic
  #   on_press:
  #     # In MODE_B the incommensurability rule INVERTS: the period must be
  #     # exactly the round and phase-locked to the node's slot. That is the mode.
  #     - lambda: 'id(rol_2)->start_mode_test(300, 1500, 2, 1, true, false, false, true);'
  # - platform: template
  #   name: "Mode Test B — bootstrap burst (node 2)"
  #   id: rol_2_modetest_b_burst
  #   entity_category: diagnostic
  #   on_press:
  #     # EIGHT COPIES, and the reason is the measurement of 2026-09-12.
  #     #
  #     # A node that is not yet promoted listens on a FREE-RUNNING 500 ms window,
  #     # and every grid-placed frame sits at a multiple of the 1500 ms round —
  #     # so gcd(1500, 500) = 500 and the marks occupy exactly ONE phase mod 500,
  #     # forever. Against a 29.44 ms window that is a ~5.9 % chance of the phase
  #     # being catchable at all, and if it is not, the node hears no mark for the
  #     # whole run: single-copy Mode B measured `detected 2` in 300 s and
  #     # returned windows 0/0.
  #     #
  #     # Eight copies at the 88 ms stride span ~704 ms, which is longer than the
  #     # 500 ms window period, so at least one copy ALWAYS lands in a window
  #     # whatever the phase. The node backs the copy index out
  #     # (drift::kCopySpacingUs) and recovers copy 0's T0, so a caught copy is
  #     # still a sample about the MARK — that path exists for exactly this case.
  #     #
  #     # This is the bootstrap instrument, not a production setting: it is how a
  #     # cold node accumulates the 8 in-guard phase samples
  #     # phaseTrustworthy() needs before timedRxActive() will arm anything.
  #     - lambda: 'id(rol_2)->start_mode_test(300, 1500, 2, 8, true, false, false, true);'
  # - platform: template
  #   name: "Mode Test A — long, MAC-0 baseline (node 2)"
  #   id: rol_2_modetest_a_long
  #   entity_category: diagnostic
  #   on_press:
  #     # Mode A's MAC-0 numbers: ppm and FER_link. 900 s is the node's cap. At the
  #     # measured 5.4-6.5 % free-running catch rate a 1093 ms grid gives ~45
  #     # marks, past the >= 30 samples over >= 200 s a rate needs. The 300 s
  #     # buttons give ~16, which cannot carry a ppm figure.
  #     - lambda: 'id(rol_2)->start_mode_test(900, 1093, 1, 1, true, false, false, true);'
  # - platform: template
  #   name: "Mode Test B — long, production profile (node 2)"
  #   id: rol_2_modetest_b_long_prod
  #   entity_category: diagnostic
  #   on_press:
  #     # HW-5 and half of HW-3, and the run Mode B's pass line is read from:
  #     # |ppm| < 20 under the PRODUCTION profile (auto light sleep, 32.768 kHz
  #     # crystal). 900 s is the node's cap (kMaxDurationS). At the free-running
  #     # ~6 % catch rate that is ~35 marks over ~900 s — past the >= 30 samples
  #     # over >= 200 s the rate needs to mean anything. The 300 s runs gave 12.
  #     - lambda: 'id(rol_2)->start_mode_test(900, 1500, 2, 1, true, false, false, true);'
  # - platform: template
  #   name: "Mode Test B — long, sleep off (node 2)"
  #   id: rol_2_modetest_b_long_measuring
  #   entity_category: diagnostic
  #   on_press:
  #     # IDENTICAL to the button above except keepPowerProfile = false: no light
  #     # sleep, CPU pinned at 240 MHz. Run back to back with it. Measured
  #     # 2026-09-13 under the production profile: phase p50 +8.5 ms, max
  #     # +17.6 ms (outside the 14 080 us guard), ppm +58 on 12 samples. If the
  #     # bias and the tail vanish here, they are light-sleep wake latency (HW-3's
  #     # delta); if the ppm drops toward DriftTest's +8, light sleep is costing
  #     # the rate and Mode B fails at the root. Draws ~11 mA while it runs.
  #     - lambda: 'id(rol_2)->start_mode_test(900, 1500, 2, 1, false, false, false, true);'
  # - platform: template
  #   name: "Mode Test Stop (node 2)"
  #   id: rol_2_modetest_stop
  #   entity_category: diagnostic
  #   on_press:
  #     - lambda: 'id(rol_2)->stop_mode_test();'

  # # HW-2, the B3 blocker: sweep the ARM instant late in 500 us steps until
  # # reception fails. The failure edge gives T_detect directly, because a window
  # # armed `l` late catches the frame iff l <= G. BENCH NODE ONLY — the node
  # # refuses this outright otherwise, since it deliberately mis-arms windows.
  # #
  # # Run one press per offset and read the funnel in the report. The early edge
  # # (negative offsets) returns G independently, and the two must sum to
  # # N*T_sym - T_detect; SweepAnalysis.h does that arithmetic.
  # #
  # # ⚠️ GRID IS 1093 ms, NOT 1100 (fixed 2026-09-19). These three buttons shipped
  # # at 1100 and were REFUSED on every press: armRefusal() gates the
  # # commensurate check on periodMattersFor(), which is true for MODE_SWEEP as
  # # well as MODE_A, and gcd(1100, 500) = 100 ms is far wider than the 29.44 ms
  # # window — ArmRefusal::CommensurateGrid, measured at "1 of 277 marks heard".
  # # So HW-2 could never have run from this control surface. 1093 gives
  # # gcd = 1 ms, so the phase walks 93 ms per mark and visits every residue.
  # - platform: template
  #   name: "Mode Sweep +4 ms (node 2, BENCH ONLY)"
  #   id: rol_2_modesweep_p4
  #   entity_category: diagnostic
  #   on_press:
  #     - lambda: 'id(rol_2)->start_mode_test(120, 1500, 4, 1, true, false, false, true, 4000);'
  # - platform: template
  #   name: "Mode Sweep +12 ms (node 2, BENCH ONLY)"
  #   id: rol_2_modesweep_p12
  #   entity_category: diagnostic
  #   on_press:
  #     - lambda: 'id(rol_2)->start_mode_test(120, 1500, 4, 1, true, false, false, true, 12000);'
  # - platform: template
  #   name: "Mode Sweep -12 ms (node 2, BENCH ONLY)"
  #   id: rol_2_modesweep_m12
  #   entity_category: diagnostic
  #   on_press:
  #     - lambda: 'id(rol_2)->start_mode_test(120, 1500, 4, 1, true, false, false, true, -12000);'
  # # The sweep the procedure actually asks for: an ARBITRARY offset, so the edge
  # # can be walked in 500 us steps. Three fixed offsets cannot find an edge that
  # # sits near +/-14 080 us; they can only say "inside" or "outside".
  # #
  # # 300 s, NOT 120 — a point must outlast PROMOTION or it measures Mode A.
  # #
  # # Measured 2026-09-19, the first sweep that ever ran: a 120 s point at +4000 us
  # # (well inside the guard) returned `windows 14/1`, `detected 8` of 71 marks.
  # # 8/71 is the Mode A free-running catch rate — RX duty ~6.5 %, grid walking at
  # # gcd 1 ms — so the node was unpromoted for nearly the whole test and armed 14
  # # timed windows only at the tail. The cause is circular and slow: promotion
  # # needs 8 phase samples, samples come only from frames actually CAUGHT, and at
  # # ~6 % that takes ~130 s — longer than the point itself.
  # #
  # # 300 s leaves ~170 s of steady Mode B after the bootstrap. The unpromoted
  # # phase does not dilute the ratio (windowsArmed counts ArmSource::Grid only,
  # # so unarmed marks are simply absent), it only shrinks `armed`.
  # #
  # # ⚠️ `armed >= 8` is NOT sufficient to trust a point. That 14/1 result clears
  # # SweepAnalysis::Point::receives()'s min_armed of 8 and would have been
  # # recorded as a FALSE EDGE at +4 ms. Require `armed` consistent with the run
  # # length (~270 for 300 s) before believing a "no reception" verdict.
  # - platform: template
  #   name: "Mode Sweep at offset (node 2, BENCH ONLY)"
  #   id: rol_2_modesweep_at_offset
  #   entity_category: diagnostic
  #   on_press:
  #     - lambda: |-
  #         id(rol_2)->start_mode_test(300, 1500, 4, 1, true, false, false, true,
  #                                    (int32_t) id(rol_2_sweep_offset_us).state);

  # # --- MAC-0 ping / echo (mac-layer.md sections 5 and 6) --------------------
  # #
  # # The one test mode that had no control at all: start_mac_ping() and
  # # stop_mac_ping() were written and had zero callers, so the mode existed and
  # # could not be run.
  # #
  # # It is the only way to measure TURNAROUND honestly. A MAC control frame is
  # # answered by MAC-0 itself, with no application message in either direction,
  # # so what it times is RxDone -> TX fire and nothing else. Every other exchange
  # # this system has carries a cover operation or a schedule somewhere inside it,
  # # and a turnaround measured that way silently includes application dispatch.
  # #
  # # It is also where stage 0 of the frame funnel comes from. Only the SENDER
  # # knows what it offered, so the node can never compute its own frame-error
  # # rate — it cannot know what it did not hear.
  # #
  # # One copy per mark, not a burst: seventeen copies of one mark is not one
  # # mark. 1100 ms for the same incommensurability reason as the drift test.
  # - platform: template
  #   name: "MAC Ping Start (node 2)"
  #   id: rol_2_mac_ping_start
  #   entity_category: diagnostic
  #   on_press:
  #     - lambda: 'id(rol_2)->start_mac_ping(300, 1100, true, 0);'
  # - platform: template
  #   name: "MAC Ping Stop (node 2)"
  #   id: rol_2_mac_ping_stop
  #   entity_category: diagnostic
  #   on_press:
  #     - lambda: 'id(rol_2)->stop_mac_ping();'
  # - platform: template
  #   name: "MAC Ping Reset Counters (node 2)"
  #   id: rol_2_mac_ping_reset
  #   entity_category: diagnostic
  #   on_press:
  #     - lambda: 'id(rol_2)->reset_mac_stats();'

# number:
#   # HW-2's arm offset, in microseconds. The procedure needs 500 us steps around
#   # a +/-14 080 us guard to find the reception edge; until this existed the only
#   # controls were three fixed offsets, which can bracket the edge but never
#   # locate it. Paired with the "Mode Sweep at offset" button above.
#   #
#   # Range is wider than the guard on purpose: the sweep must reach offsets that
#   # FAIL, or it never sees an edge. A run at an offset outside the guard is
#   # expected to lose marks — that is the measurement, not a fault.
#   - platform: template
#     name: "Mode Sweep arm offset (node 2)"
#     id: rol_2_sweep_offset_us
#     entity_category: config
#     optimistic: true
#     restore_value: true
#     initial_value: 0
#     min_value: -20000
#     max_value: 20000
#     step: 500
#     unit_of_measurement: us
#     mode: box

sensor:
  # --- ModeTest and MAC-ping results, as numbers ---------------------------
  #
  # The hub already recomputes these from the node's RAW counters (I1: the node
  # never grades itself) and logs them in one line. The line is for a console;
  # these are for Home Assistant, where B3's gate actually lives — "reception
  # >= Mode A over a week" is a week of HISTORY, and a log line cannot be
  # graphed. A single text_sensor could not carry it either: HA caps a state at
  # 255 characters and the report line is up to 512, so it would truncate
  # silently, which is the trap the `help` entity already fell into once.
  #
  # update_interval is slow on purpose: a report arrives at the END of a run
  # (300 s by default), so polling faster only costs entity churn.
  # - platform: template
  #   name: "Mode Test — mode actually run (node 2)"
  #   id: rol_2_mt_mode
  #   entity_category: diagnostic
  #   update_interval: 30s
  #   accuracy_decimals: 0
  #   # 1 = A, 2 = B, 4 = SWEEP. DERIVED from what the node applied, not from
  #   # what the button asked for: mode was echoed from the request until this
  #   # session, so every "Mode Test B" number ever taken described Mode A.
  #   lambda: 'return id(rol_2)->mode_test_summary().valid
  #                ? (float) id(rol_2)->mode_test_summary().mode
  #                : NAN;'
  # - platform: template
  #   name: "Mode Test — arm refusal (node 2)"
  #   id: rol_2_mt_refusal
  #   entity_category: diagnostic
  #   update_interval: 30s
  #   accuracy_decimals: 0
  #   # 0 = armed. Anything else and the run below describes nothing: see
  #   # ModeTestPolicy.h's ArmRefusal.
  #   lambda: 'return id(rol_2)->mode_test_summary().valid
  #                ? (float) id(rol_2)->mode_test_summary().arm_refusal
  #                : NAN;'
  # - platform: template
  #   name: "Mode Test — windows armed (node 2)"
  #   id: rol_2_mt_windows_armed
  #   entity_category: diagnostic
  #   update_interval: 30s
  #   accuracy_decimals: 0
  #   # The witness for whether Mode B actually RAN. Enabling timed RX makes the
  #   # mode reachable; timedRxActive() re-runs the promotion test at every mark,
  #   # so a node whose phase never becomes trustworthy reports mode = 2 over
  #   # marks it never armed. This reads 0 when that happened — and WMR cannot
  #   # say so, because a zero denominator gives 0 ppm, the same number a
  #   # flawless run gives.
  #   lambda: 'return id(rol_2)->mode_test_summary().valid
  #                ? (float) id(rol_2)->mode_test_summary().windows_armed
  #                : NAN;'
  # - platform: template
  #   name: "Mode Test — windows hit (node 2)"
  #   id: rol_2_mt_windows_hit
  #   entity_category: diagnostic
  #   update_interval: 30s
  #   accuracy_decimals: 0
  #   lambda: 'return id(rol_2)->mode_test_summary().valid
  #                ? (float) id(rol_2)->mode_test_summary().windows_hit
  #                : NAN;'
  # - platform: template
  #   name: "Mode Test — FER link (node 2)"
  #   id: rol_2_mt_fer_link
  #   entity_category: diagnostic
  #   unit_of_measurement: "ppm"
  #   update_interval: 30s
  #   accuracy_decimals: 0
  #   # The honest denominator is the node's own seqFirst..seqLast span, not the
  #   # hub's count: dividing by what the hub queued before the node started
  #   # listening would report the node's late arrival as packet loss.
  #   lambda: 'return id(rol_2)->mode_test_summary().valid
  #                ? (float) id(rol_2)->mode_test_summary().fer_link_ppm
  #                : NAN;'
  # - platform: template
  #   name: "Mode Test — window miss rate (node 2)"
  #   id: rol_2_mt_wmr
  #   entity_category: diagnostic
  #   unit_of_measurement: "ppm"
  #   update_interval: 30s
  #   accuracy_decimals: 0
  #   # Read this WITH windows armed above, never alone.
  #   lambda: 'return id(rol_2)->mode_test_summary().valid
  #                ? (float) id(rol_2)->mode_test_summary().wmr_ppm
  #                : NAN;'
  # - platform: template
  #   name: "Mode Test — phase error p99 (node 2)"
  #   id: rol_2_mt_phase_p99
  #   entity_category: diagnostic
  #   unit_of_measurement: "us"
  #   update_interval: 30s
  #   accuracy_decimals: 0
  #   # Against the guard band of 14080 us. p99 rather than a mean, because the
  #   # tail is the thing: a mean would hide exactly the excursions that miss a
  #   # window.
  #   lambda: 'return id(rol_2)->mode_test_summary().valid
  #                ? (float) id(rol_2)->mode_test_summary().phase_p99_us
  #                : NAN;'
  # - platform: template
  #   name: "Mode Test — turnaround p99 (node 2)"
  #   id: rol_2_mt_turnaround_p99
  #   entity_category: diagnostic
  #   unit_of_measurement: "us"
  #   update_interval: 30s
  #   accuracy_decimals: 0
  #   # Section 4.3's servable-slot rule is priced against this.
  #   lambda: 'return id(rol_2)->mode_test_summary().valid
  #                ? (float) id(rol_2)->mode_test_summary().turnaround_p99_us
  #                : NAN;'

  # # U-2: windows the node MEANT to open and never did, because its radio was
  # # still busy when the mark came round. Not a ModeTest number — it is counted
  # # continuously and rides every PhaseReport, so it is live rather than
  # # per-run.
  # #
  # # READ IT BESIDE the window miss rate above, never instead of it. A mark that
  # # was never armed is invisible to WMR by construction, because noteMarkArmed()
  # # is what opens a mark at all: a node whose radio is wedged reports a flawless
  # # WMR while hearing nothing. This is the number that says so, and it is why a
  # # perfect miss rate is not on its own evidence of a working link.
  # #
  # # NAN until a PhaseReport has arrived, so "this node has not answered" does
  # # not plot as a flat clean zero. It does NOT distinguish firmware without the
  # # field — rxBusySkips is a proto3 scalar, so absent and 0 are the same bytes
  # # on the air. Nothing is deployed yet, so no such firmware exists to confuse
  # # it with.
  # - platform: template
  #   name: "RX windows skipped — radio busy (node 2)"
  #   id: rol_2_rx_busy_skips
  #   entity_category: diagnostic
  #   update_interval: 30s
  #   accuracy_decimals: 0
  #   lambda: 'return id(rol_2)->node_rx_busy_skips().valid
  #                ? (float) id(rol_2)->node_rx_busy_skips().count
  #                : NAN;'

  # # T-2: frames the HUB refused because its transmit buffer pool was empty.
  # #
  # # The pool is POOL_SIZE = 5 and the handoff queue is 20, but nothing enters
  # # the queue without a buffer and a PLACED frame holds its buffer from send()
  # # until its mark — so the pool, not the queue, is the real depth. A
  # # fleet-wide push places one frame per node with all 32 marks inside one
  # # round, and the sixth onwards is refused.
  # #
  # # Refusal is handled rather than silent: the node's mark is not consumed, the
  # # schedule push has an ack-driven retry, and BaseNonceExchange keeps the
  # # previous nonce so the session survives. This number is how you find out it
  # # is happening at all — it is tracker-wide, not per node, because the pool is.
  # - platform: template
  #   name: "Transmit pool exhausted — frames refused"
  #   id: lora_pool_refusals
  #   entity_category: diagnostic
  #   update_interval: 30s
  #   accuracy_decimals: 0
  #   lambda: 'return (float) id(my_lora_tracker)->poolAllocationFailures();'

  # # U-1: whether this node is on ONE copy per frame or seventeen.
  # #
  # # This is what the whole of Mode B buys — a 17x airtime reduction on every
  # # addressed downlink — and until now it was visible only in an ESPHome log
  # # line, so nobody could see whether a fleet was actually getting it.
  # #
  # # Two entities, deliberately. The boolean says what is happening; the reason
  # # below says why, and the reason is the one you act on. "Single shot: no" on
  # # a node you expected to be promoted tells you nothing about whether it needs
  # # a crystal, a longer baseline, or simply more time.
  # - platform: template
  #   name: "Single shot active (node 2)"
  #   id: rol_2_single_shot
  #   entity_category: diagnostic
  #   update_interval: 30s
  #   accuracy_decimals: 0
  #   lambda: 'return id(rol_2)->txPolicyNow() == timedmode::TxPolicy::SingleShot
  #                ? 1.0f : 0.0f;'

  # # Why it is still bursting, from the same ladder the decision comes out of —
  # # see TimedModePolicy.h's TxRefusal. 0 means it is not.
  # #
  # #  1 no grid           6 rule 4: a single shot went unacked
  # #  2 rebooted          7 no phase report yet
  # #  3 new session       8 not on the external crystal
  # #  4 beacon missed     9 phase baseline too short
  # #  5 firmware unknown 10 phase mean outside the guard band
  # #                     11 phase spread too wide (bimodal)
  # #                     12 the node scored samples outside the guard
  # #                     13 the hub published no resyncMaxS
  # #                     14 the confirmation has gone stale
  # #
  # # The numbers are a wire format now that they are published here: append to
  # # the enum, never renumber.
  # - platform: template
  #   name: "Single shot refused — reason (node 2)"
  #   id: rol_2_single_shot_refusal
  #   entity_category: diagnostic
  #   update_interval: 30s
  #   accuracy_decimals: 0
  #   lambda: 'return (float) (uint8_t) id(rol_2)->txRefusalNow();'

  # # U-5: the node has missed a check-in the hub PREDICTED it would make.
  # #
  # # The prediction is next_wake_epoch_(), which the hub already computes from
  # # the node's own vendored scheduler so it does not transmit at a sleeping
  # # node — the comparison against what was actually observed is all that was
  # # missing. It gates single-shot (refusal reason 4 above) and is published
  # # here because "this node has gone quiet" is a thing an operator acts on
  # # directly.
  # #
  # # 0 for a node the hub cannot predict — never heard from, or no hub clock.
  # # A prediction that cannot be made must not read as a failure.
  # # Why the node is NOT in Mode B, in its own words. The beacon has carried
  # # demotionReason since B3 and the hub stored it in belief_.node_demotion
  # # (lora_client.cpp:3853) without ever publishing it — the same "carried,
  # # stored, never read" shape as review findings 10 and 12.
  # #
  # # It is the difference between a bench procedure that waits and hopes and one
  # # that checks. HW-2 cost two void points to this: a sweep started inside the
  # # 600 s anti-flap hold (Demotion::RecentlyDemoted = 7) armed NOTHING and
  # # reported windows 0/0, which reads exactly like "no reception at this
  # # offset". That hold was retired 2026-09-20, so this particular trap cannot
  # # recur — but the rule is unchanged and still worth obeying: read this before
  # # pressing, and anything but 0 (None) means the point will be void, whatever
  # # the offset.
  # #
  # # Legend (timedmode::Demotion, TimedModePolicy.h — read from the enum, not
  # # from memory): 0 None, 1 GridDisabled, 2 BadClockSource,
  # # 3 MissedMarks (RETIRED 2026-09-20, never returned),
  # # 4 SyncStale, 5 NoPhase, 6 NotConfirmed (RETIRED 2026-09-14, never returned),
  # # 7 RecentlyDemoted (RETIRED 2026-09-20, never returned).
  # #
  # # The numbers are a wire format: a retired reason keeps its value and stops
  # # being produced. In practice a node is now out of Mode B for one of 1, 2, 4
  # # or 5 — where 4 (SyncStale) is the beacon heartbeat: nothing addressed to it
  # # and no beacon for the published resyncMaxS, ~5.9 min.
  # - platform: template
  #   name: "Timed RX — demotion reason (node 2)"
  #   id: rol_2_demotion_reason
  #   entity_category: diagnostic
  #   update_interval: 30s
  #   accuracy_decimals: 0
  #   lambda: 'return (float) id(rol_2)->node_demotion_reason();'

  # # The other half of the same precondition: the node's own answer to "am I
  # # arming timed windows". A sweep point is only a measurement when this is 1
  # # AND the demotion reason is 0; otherwise `windows 0/0` says the node was not
  # # in Mode B, not that the offset failed.
  # - platform: template
  #   name: "Timed RX — active per the node (node 2)"
  #   id: rol_2_timed_rx_active
  #   entity_category: diagnostic
  #   update_interval: 30s
  #   accuracy_decimals: 0
  #   lambda: 'return id(rol_2)->node_timed_rx_active() ? 1.0f : 0.0f;'

  # # The four inputs phaseTrustworthy() tests. Demotion::NoPhase (5) has TWO
  # # producers that report identically — !phase_valid, and the last sample being
  # # outside the guard — so these are what turn "reason 5" into an attribution.
  # #
  # # phaseTrustworthy fails if: samples < 8, frames < 2, outside_guard != 0, or
  # # spread > 14080 us. Measured 2026-09-19: a warm-up reported phaseErr p50 -605
  # # p99 352 max 2005 over 197 samples — every sample far inside the guard — and
  # # still sat on NoPhase, so the failing clause is spread or the last-sample
  # # test, not a latched outside_guard as first assumed.
  # - platform: template
  #   name: "Phase — spread (node 2)"
  #   id: rol_2_phase_spread
  #   entity_category: diagnostic
  #   unit_of_measurement: us
  #   update_interval: 30s
  #   accuracy_decimals: 0
  #   lambda: 'return (float) id(rol_2)->node_phase_spread_us();'
  # - platform: template
  #   name: "Phase — samples outside guard (node 2)"
  #   id: rol_2_phase_outside_guard
  #   entity_category: diagnostic
  #   update_interval: 30s
  #   accuracy_decimals: 0
  #   lambda: 'return (float) id(rol_2)->node_phase_outside_guard();'
  # - platform: template
  #   name: "Phase — samples (node 2)"
  #   id: rol_2_phase_samples
  #   entity_category: diagnostic
  #   update_interval: 30s
  #   accuracy_decimals: 0
  #   lambda: 'return (float) id(rol_2)->node_phase_samples();'
  # - platform: template
  #   name: "Phase — last error (node 2)"
  #   id: rol_2_phase_err
  #   entity_category: diagnostic
  #   unit_of_measurement: us
  #   update_interval: 30s
  #   accuracy_decimals: 0
  #   lambda: 'return (float) id(rol_2)->node_phase_err_us();'

  # - platform: template
  #   name: "Node overdue — missed a predicted check-in (node 2)"
  #   id: rol_2_overdue
  #   entity_category: diagnostic
  #   update_interval: 30s
  #   accuracy_decimals: 0
  #   lambda: 'return id(rol_2)->node_overdue() ? 1.0f : 0.0f;'

  # # MAC ping, stage 0 of the funnel. pings_offered is the only number in this
  # # system that the HUB alone can know.
  # - platform: template
  #   name: "MAC Ping — offered (node 2)"
  #   id: rol_2_macping_offered
  #   entity_category: diagnostic
  #   update_interval: 30s
  #   accuracy_decimals: 0
  #   lambda: 'return (float) id(rol_2)->mac_stats().pings_offered;'
  # - platform: template
  #   name: "MAC Ping — echoes received (node 2)"
  #   id: rol_2_macping_echoes
  #   entity_category: diagnostic
  #   update_interval: 30s
  #   accuracy_decimals: 0
  #   lambda: 'return (float) id(rol_2)->mac_stats().echoes_rx;'
  # # --- Mode C's Class A ledger ---------------------------------------------
  # #
  # # Both halves of this measurement existed and were never added up. The hub
  # # places one reply into RX1 on every check-in (send_timesync ->
  # # send_into_class_a_window_); the node reports that wake's funnel in its NEXT
  # # beacon (prevwakewindows/hits/detected/crcvalid — "Mode C's FER" in the
  # # node's own comment). One lived in a log line, the other in a beacon field.
  # #
  # # Without the pair an empty Class A window is AMBIGUOUS between "nothing was
  # # aimed at it" and "aimed and missed", which is why the 2026-09-21 Mode C run
  # # (`windows 4 hits 1`, `windows 2 hits 1`) could not yield a Class A FER.
  # #
  # # RAW COUNTERS, as with the MAC ping above and the ModeTest report: the node
  # # never grades itself, the hub adds up what each end observed, the operator
  # # divides.
  # #
  # #   hit rate = hits / offered        true FER = 1 - crcValid / detected
  # - platform: template
  #   name: "Class A — replies offered (node 2)"
  #   id: rol_2_classa_offered
  #   entity_category: diagnostic
  #   update_interval: 30s
  #   accuracy_decimals: 0
  #   # Counted at the PLACEMENT, so it means "the hub aimed a frame at a window
  #   # it believed open" — the question an empty window cannot answer alone.
  #   lambda: 'return (float) id(rol_2)->class_a_stats().offered;'
  # - platform: template
  #   name: "Class A — windows opened (node 2)"
  #   id: rol_2_classa_windows
  #   entity_category: diagnostic
  #   update_interval: 30s
  #   accuracy_decimals: 0
  #   lambda: 'return (float) id(rol_2)->class_a_stats().windows;'
  # - platform: template
  #   name: "Class A — windows hit (node 2)"
  #   id: rol_2_classa_hits
  #   entity_category: diagnostic
  #   update_interval: 30s
  #   accuracy_decimals: 0
  #   lambda: 'return (float) id(rol_2)->class_a_stats().hits;'
  # - platform: template
  #   name: "Class A — frames detected (node 2)"
  #   id: rol_2_classa_detected
  #   entity_category: diagnostic
  #   update_interval: 30s
  #   accuracy_decimals: 0
  #   lambda: 'return (float) id(rol_2)->class_a_stats().detected;'
  # - platform: template
  #   name: "Class A — frames CRC-valid (node 2)"
  #   id: rol_2_classa_crcvalid
  #   entity_category: diagnostic
  #   update_interval: 30s
  #   accuracy_decimals: 0
  #   # Stage 2->3 of the funnel. true FER = 1 - this/detected, the figure
  #   # mac-layer.md 6.1 calls the only one comparable across modes.
  #   lambda: 'return (float) id(rol_2)->class_a_stats().crc_valid;'

  # - platform: template
  #   name: "MAC Ping — echo gaps (node 2)"
  #   id: rol_2_macping_gaps
  #   entity_category: diagnostic
  #   update_interval: 30s
  #   accuracy_decimals: 0
  #   # Marks with no echo, counted by SEQUENCE rather than by absence: a gap is
  #   # a mark the node did not answer, which is not the same as a slow one.
  #   lambda: 'return (float) id(rol_2)->mac_stats().echo_seq_gaps;'

  # # HW-10: the hub's RX-stamp uncertainty, as a high-water mark.
  # #
  # # worst_poll_gap_us() was already measured on every poll (lora_tracker.cpp:264)
  # # and printed ONLY by dump_config() at boot — so reading it meant restarting
  # # the hub, which zeroes the counter you came to read. Published here it is
  # # readable while the hub runs, which is what the runbook's "closes when you
  # # have the high-water number" actually needs.
  # #
  # # Expect it to be LARGE during a burst: checkReception() is not called while
  # # lora_tx_busy_, so the gap across a 17-copy burst IS the burst. That is
  # # honest — the hub genuinely was not listening — and not a defect.
  # - platform: template
  #   name: "Hub RX stamp — worst poll gap"
  #   id: hub_worst_poll_gap
  #   entity_category: diagnostic
  #   unit_of_measurement: us
  #   update_interval: 60s
  #   accuracy_decimals: 0
  #   lambda: 'return (float) id(my_lora_tracker)->worst_poll_gap_us();'

  # HW-9, hub half. The node half closed from the ModeTest report (tick 100 Hz);
  # the hub half could not, because tickRateHz in that report is a field the
  # NODE fills. What was unconfirmed is that this build HONOURS the pin at
  # line 33 (CONFIG_FREERTOS_HZ: "1000") rather than inheriting a default, and
  # the compiled macro is exactly that confirmation: it is the value the built
  # firmware's pdMS_TO_TICKS quantises against.
  - platform: template
    name: "Hub FreeRTOS tick rate"
    id: hub_tick_rate_hz
    entity_category: diagnostic
    unit_of_measurement: Hz
    update_interval: 300s
    accuracy_decimals: 0
    lambda: 'return (float) CONFIG_FREERTOS_HZ;'

  - platform: uptime
    name: '${devicename} Uptime'
    unit_of_measurement: days
    update_interval: 300s
    filters:
      - multiply: 0.000011574

  - platform: wifi_signal
    name: '${devicename} WiFi Signal'
    update_interval: 300s

  - platform: loracover
    lora_client_id: rol_1
    # cover_id: rol_1
    # name: "RollladenWohnzimmer1 Battery"
    # id: rol_1_battery
    # type: BATTERY
    battery_level:
      name: "RollladenWohnzimmer1 Battery Level"
      id: rol_1_battery_level
    battery_voltage:
      name: "RollladenWohnzimmer1 Battery Voltage"
      id: rol_1_battery_voltage
