switch:
  # --- B3: put a node into Mode B (timed windows) ---------------------------
  #
  # THE ENTRY POINT THAT WAS MISSING. Until this existed, send_grid_sync(true)
  # was never called from anywhere and set_grid_aligned() had no callers, so no
  # node could be told to adopt a grid however correct the node's own code was —
  # and HW-2's sweep could not run either, because it needs a GridSync carrying
  # armOffsetUs and the hub emitted none.
  #
  # Default OFF, and a deliberate opt-in rather than automatic promotion:
  # T_detect is still unmeasured, so the guard band Mode B rests on is an
  # assumption, and alignment costs up to 1.5 s of latency until the timed
  # window exists.
  #
  # Turning this on makes Mode B REACHABLE, not active — the node's own policy
  # still gates promotion on ppm validity, phase trustworthiness, missed marks
  # and the RTC source.
  #
  # STAYS ON ACROSS SLEEP, NODE REBOOT AND HUB REBOOT (2026-10-10). The switch is
  # RESTORE_DEFAULT_OFF: what the operator last chose is what comes back after a
  # hub restart (a never-touched switch stays OFF). A restored ON is applied by
  # the template switch at boot (setup priority 798, before the listener's 600
  # and the radio's 300), so enable_timed_mode(true) only records the intent
  # then (LORAListener::restore_timed_mode_at_boot_) and the grid is published,
  # encrypted, at each node's first confirmed session as it always is.
  #
  # Publishing the grid is not enough - a node adopts it but never promotes by
  # itself (docs/bench-runbook.md, "waiting for the node to promote on its own is
  # a deadlock"). So the hub ALSO supervises every node whose switch is ON
  # (lora_client/ModeBSupervisor.h): whenever the node is logged in, awake, on an
  # acknowledged and settled grid and NOT reported promoted, it runs a 60 s
  # single-copy ModeTest B warm-up (the 'Mode Test B - timed windows' primitive),
  # one node at a time hub-wide, never over a cover op, retried on a 2 / 5 / 15
  # min then hourly backoff. Look for 'Mode B warm-up START' and 'Mode B
  # RE-ESTABLISHED' in the hub log. NOTE: ESPHome buffers the restored state
  # (preferences: flash_write_interval), so a switch flipped within 30 min of a
  # hub restart can come back in its old position - press 'Hub Restart' to flush.
  - platform: template
    name: "Timed Mode (Mode B) — Node 2"
    id: rol_2_timed_mode
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: 'id(rol_2)->enable_timed_mode(true);'
    turn_off_action:
      - lambda: 'id(rol_2)->enable_timed_mode(false);'

  - platform: template
    name: "Timed Mode (Mode B) — Node 1"
    id: rol_1_timed_mode
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: 'id(rol_1)->enable_timed_mode(true);'
    turn_off_action:
      - lambda: 'id(rol_1)->enable_timed_mode(false);'

  # OPTIMISTIC SINGLE SHOT (nodes 2 and 1). Default OFF, and the default is the point.
  # Enabled 2026-10-06 as an OPT-IN for the soak: RESTORE_DEFAULT_OFF, so a switch
  # turned on survives a hub reboot and a fresh install stays off. A wrong guess
  # is found out after ~500 ms + the time to the node's mark, not 3 s, and that
  # miss is not counted against the 4-retry session-teardown budget
  # (lora_client/SingleShotAckWait.h).
  #
  # When the ONLY rung refusing single shot is that the hub's confirmation has
  # aged out (ConfirmationStale), the hub spends ONE placed copy instead of a
  # 17-copy burst and lets §4.6 Rule 4 cover a wrong guess: an unacked single
  # shot is retried as a burst immediately, so being wrong costs one frame.
  #
  #   expected = p x 42 ms + (1 - p) x 757 ms, against 715 ms always
  #   break-even at p = 6 %
  #
  # Measured 2026-09-21: a node genuinely in Mode B hit 198/198 and 194/194
  # windows at WMR 0 ppm, so p is near 1 when it really is promoted and near
  # the Mode A free-running catch rate (~6 %) when it is not — which IS the
  # break-even, so the change is close to free even when the optimism is wrong.
  #
  # NOT §4.4's rejected keepalive: that was a PERIODIC unicast at 5.8 min,
  # 274.5 s/day at 32 nodes, 3.4x worse than all-burst. This is demand-driven
  # and costs nothing while the fleet is idle.
  #
  # It never bypasses positive evidence that the node moved — no grid, reboot,
  # new session, missed beacon, unknown firmware, Rule 4, node-not-timed all
  # still burst — and it does NOT bypass NoPhaseReport, which would be inert
  # (node_timed_rx rides the same report) and unsafe.
  #
  # A switch rather than automatic, for the same reason Timed Mode above is:
  # it relaxes "any hub uncertainty -> burst", which is the safety argument.
  # Default ON since 2026-10-09: the adaptive first-ack deadline was verified on
  # hardware (12/12 optimistic ops acked, 0 premature bursts). Turn it off to
  # fall back to the always-burst-when-unsure behaviour.
  - platform: template
    name: "Optimistic single shot (node 2)"
    id: rol_2_optimistic_single_shot
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: 'id(rol_2)->enable_optimistic_single_shot(true);'
    turn_off_action:
      - lambda: 'id(rol_2)->enable_optimistic_single_shot(false);'

  - platform: template
    name: "Optimistic single shot (node 1)"
    id: rol_1_optimistic_single_shot
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: 'id(rol_1)->enable_optimistic_single_shot(true);'
    turn_off_action:
      - lambda: 'id(rol_1)->enable_optimistic_single_shot(false);'

  # P4b: automatic-mode control. The switch expresses INTENT — the node still
  # refuses auto mode without a valid clock and a usable schedule, and a button
  # press at the blind flips it back to interactive. The published state is
  # corrected from what the node reports in its wake beacon.
  - platform: loracover
    lora_client_id: rol_1
    name: "RollladenWohnzimmer1 Auto Mode"
    id: rol_1_auto_mode
  - platform: loracover
    lora_client_id: rol_2
    name: "RollladenWohnzimmer2 Auto Mode"
    id: rol_2_auto_mode


binary_sensor:
  - platform: loracover
    lora_client_id: rol_1
    name: "RollladenWohnzimmer1 Command Failed"
    id: rol_1_command_failed
  - platform: loracover
    lora_client_id: rol_2
    name: "RollladenWohnzimmer2 Command Failed"
    id: rol_2_command_failed

  # Briefly true after a schedule edit; persistently true means pushes are not
  # reaching the node.
  - platform: loracover
    lora_client_id: rol_1
    type: schedule_pending
    name: "RollladenWohnzimmer1 Schedule Pending"
    id: rol_1_schedule_pending
  - platform: loracover
    lora_client_id: rol_2
    type: schedule_pending
    name: "RollladenWohnzimmer2 Schedule Pending"
    id: rol_2_schedule_pending

  # The hub's picture of the node's sleep: ON from the SLEEP ack until the node
  # is awake again (heard, or the modelled wake minus the boot margin). A cover
  # op or sysop issued while it is ON is IGNORED (logged, nothing sent). Not a
  # problem state, hence no device class.
  - platform: loracover
    lora_client_id: rol_1
    type: asleep
    device_class: ""
    icon: "mdi:sleep"
    name: "RollladenWohnzimmer1 Asleep"
    id: rol_1_asleep
  - platform: loracover
    lora_client_id: rol_2
    type: asleep
    device_class: ""
    icon: "mdi:sleep"
    name: "RollladenWohnzimmer2 Asleep"
    id: rol_2_asleep

# Companion of the Asleep sensors: "awake", "asleep until 05:00",
# "sleep unconfirmed" (or "auto mode").
text_sensor:
  - platform: loracover
    lora_client_id: rol_1
    name: "RollladenWohnzimmer1 Sleep Status"
    id: rol_1_sleep_status
  - platform: loracover
    lora_client_id: rol_2
    name: "RollladenWohnzimmer2 Sleep Status"
    id: rol_2_sleep_status

# ---- Schedule editing from Home Assistant --------------------------------
#
# The `schedule:` list above each client is a FIRST-BOOT SEED: once the schedule
# has been edited in HA the hub persists it and the seed is ignored. A sleeping
# node picks an edit up at its next wake (watch the `Schedule Pending` sensor).
# (The per-slot entity UI that preceded the text line was removed 2026-11-08.)

# ---- Schedule as one editable line (the alternative being trialled) ---------
#
#   06:00 daily open; 21:45 daily close; 12:00 sat position:40
#
# Two entities instead of twenty. Days accept arbitrary lists (mon,thu) which
# the select could not express, and position is part of the syntax rather than
# a separate control that was missing entirely in the first version.
#
# A rejected edit changes nothing and the status entity says why; the text box
# always shows the canonical form of what the hub actually holds.
text:
  - platform: loracover
    mode: TEXT
    lora_client_id: rol_2
    name: "Rol2 Schedule"
    status:
      name: "Rol2 Schedule Status"
    # No `help:` entity here on purpose. A text_sensor carrying help text is
    # capped at 255 characters and spends an entity on something that is not
    # device state — and HA showed it as unavailable because a READ-ONLY
    # entity marked entity_category: config is semantically wrong
    # (config = changes settings, diagnostic = read-only info).
    #
    # CONFIRMED 2026-08-31: the status text_sensor had the same miscategory
    # and was likewise unavailable in HA. Fixed in the component
    # (loracover/text/__init__.py), so it applies to every node rather than
    # being patched per YAML block. The `help` entity was deleted on a hunch
    # about this; the hunch was right.
    #
    # The syntax lives in docs/schedule-text-syntax.md, and the Lovelace card
    # at the end of that file puts it beside the field in the dashboard —
    # unlimited length, formatted, zero entities.

