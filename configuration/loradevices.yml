substitutions:
  devicename: "loradevices"



esphome:
  name: $devicename
  # Example configuration entry

  # comment: "MyBlinds"
  # name_add_mac_suffix: true
  # project:
  #   name: "Blinds"
  #   version: "V0.1"

esp32:
  variant: esp32
  cpu_frequency: 240MHz
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_XTAL_FREQ_26: y
      CONFIG_INT_WDT_TIMEOUT_MS: "800"
      CONFIG_FREERTOS_CHECK_STACKOVERFLOW_CANARY: y
      CONFIG_FREERTOS_WATCHPOINT_END_OF_STACK: y
    # advanced:
    #   loop_task_stack_size: 16384
  
preferences:
  flash_write_interval: 30min    

external_components:
  # use all components from a local folder
  - source:
      type: local
      path: local_components

# Enable logging
logger:


# Enable Home Assistant API
api:

ota:
  platform: esphome
  password: !secret esphome_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: .fritz.box
  fast_connect: on

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${devicename}-AP"

captive_portal:

# see: https://esphome.io/components/time.html
time:
  - platform: homeassistant
    id: homeassistant_time
    on_time:
      - seconds: 0
        minutes: 0
        hours: 23
        days_of_week: MON-SUN
        then:
          - loracover.on_sleep_start: rol_1
          - loracover.on_sleep_start: rol_2



# Enable Web server
web_server:
  port: 80


lora_tracker:
  id: my_lora_tracker


lora_client:
  - id: rol_1
    name: "RollladenWohnzimmer1"
    time_id: homeassistant_time
    short_address: 17
    subnet_address: 02
    sleep_duration: 21600
    battery_update_interval: 15min
    mac_address: e0:8c:fe:5f:b7:a4
    # P4: automatic (scheduled) mode.
    #
    # Back to FALSE (interactive) as the seed. Auto mode has been proven in
    # production (21:45 close and 06:00 open both fired), but a node in auto
    # mode SLEEPS, and a sleeping node cannot be reached for an OTA or a drift
    # test without a physical button press at the blind. Interactive is the
    # right default while the drift work is in progress.
    #
    # NOTE: this is only the FIRST-BOOT seed. Once a schedule has been stored,
    # load_schedule_() restores the persisted mode and logs "YAML seed
    # ignored" — so changing this line does NOT flip a hub that already has
    # AUTO in flash. Use the Auto Mode switch in HA for that.
    auto_mode: false
    interactive_timeout: 30min
    checkin_interval: 6h
    catchup_window: 0min
    schedule:
      - time: "06:00:00"
        days: weekdays
        action: open
      - time: "07:30:00"
        days: weekend
        action: open
      - time: "21:45:00"
        days: daily
        action: close
      # - time: "12:00:00"
      #   days: sat
      #   action: position
      #   position: 40


  - id: rol_2
    name: "RollladenWohnzimmer2"
    time_id: homeassistant_time
    short_address: 18
    subnet_address: 02
    sleep_duration: 21600
    battery_update_interval: 15min
    mac_address: e0:8c:fe:5f:9e:c4
    # ---- node 2, bench unit ----
    # The auto-mode trial succeeded here (both scheduled events fired), so the
    # short checkin_interval has been raised to 6h as that note intended.
    #
    # Seeded INTERACTIVE: this is the node the drift test runs on, and the test
    # needs it awake and listening. See the note on node 1 — this seed is
    # ignored once a schedule is stored, so the HA switch is the live control.
    auto_mode: false
    interactive_timeout: 30min
    checkin_interval: 6h
    catchup_window: 0min
    # Two events eight minutes apart so one run observes both a first entry
    # into auto mode AND a wake out of deep sleep with the RTC markers already
    # valid — which is the case the boot forensics were added to read.
    schedule:
      - time: "21:45:00"
        days: daily
        action: close
      - time: "06:00:00"
        days: daily
        action: open

#mac_address: c4:9e:5f:fe:8c:e0


cover:
  - platform: loracover
    lora_client_id: rol_1
    name: "RollladenWohnzimmer1"
    id: rol_1_cover
    invert_position: false
    # Bar-travel-only times (top <-> sill). Slats nest/un-nest at the sill:
    #   open_slack  = un-seal run before travel when opening from fully closed
    #   close_slack = seal run budget after travel reaches 0 on a full close
    # Starting estimates — recalibrate with a stopwatch.
    open_duration: 38
    close_duration: 36
    open_slack: 7
    close_slack: 7
    blind_height_mm: 2000.0
    axle_diameter_mm: 60.0
    blind_thickness_mm: 8.0

  - platform: loracover
    lora_client_id: rol_2
    name: "RollladenWohnzimmer2"
    id: rol_2_cover
    invert_position: false
    open_duration: 38
    close_duration: 36
    open_slack: 7
    close_slack: 7
    blind_height_mm: 2000.0
    axle_diameter_mm: 60.0
    blind_thickness_mm: 8.0



button:
  - platform: restart
    name: "Hub Restart"
    id: hub_restart
  - platform: loracover
    lora_client_id: rol_1
    name: "Trigger OTA1"
    id: rol_1_trigger_ota_button
    # type: trigger_ota
  - platform: loracover
    lora_client_id: rol_2
    name: "Trigger OTA2"
    id: rol_2_trigger_ota_button
    # type: trigger_ota

  # --- Clock-drift characterisation (bench only) ---------------------------
  # Puts both ends into test mode: the node holds continuous RX, the hub emits
  # a burst every 15 s as a regular ruler. The node then regresses the arrival
  # times of the 17 copies against their known 88235 us spacing; the slope is
  # the relative drift. Result appears in the node's serial log as
  # "DriftTest result: +N ppm over M bursts".
  #
  # Continuous RX costs ~11 mA against the ~1.2 mA interactive average, so this
  # is NOT something to leave running. Both ends stop themselves after 5 min,
  # and the node's timeout is independent of the hub — if the hub goes away
  # mid-test the node still exits.
  - platform: template
    name: "Drift Test Start (node 2)"
    id: rol_2_drift_start
    entity_category: diagnostic
    on_press:
      # 1100 ms, deliberately NOT a multiple of the node's 500 ms RX interval.
      # Commensurate periods phase-lock: a 1000 ms grid against 500 ms windows
      # keeps a constant phase relationship, so if a frame starts landing in the
      # node's RX-off gap it does so forever. Observed exactly that — ~300 grid
      # frames heard, zero. Belt and braces: the node is in continuous RX by the
      # time the grid starts, so this should not matter.
      - lambda: 'id(rol_2)->start_drift_test(300, 1100);'
  - platform: template
    name: "Drift Test Stop (node 2)"
    id: rol_2_drift_stop
    entity_category: diagnostic
    on_press:
      - lambda: 'id(rol_2)->stop_drift_test();'

sensor:
  - platform: uptime
    name: '${devicename} Uptime'
    unit_of_measurement: days
    update_interval: 300s
    filters:
      - multiply: 0.000011574

  - platform: wifi_signal
    name: '${devicename} WiFi Signal'
    update_interval: 300s

  - platform: loracover
    lora_client_id: rol_1
    # cover_id: rol_1
    # name: "RollladenWohnzimmer1 Battery"
    # id: rol_1_battery
    # type: BATTERY
    battery_level:
      name: "RollladenWohnzimmer1 Battery Level"
      id: rol_1_battery_level
    battery_voltage:
      name: "RollladenWohnzimmer1 Battery Voltage"
      id: rol_1_battery_voltage
    link_rssi:
      name: "RollladenWohnzimmer1 Link RSSI"
      id: rol_1_link_rssi
    motor_current:
      name: "RollladenWohnzimmer1 Motor Current"
      id: rol_1_motor_current
    # P2: node clock minus hub clock, reported in each wake beacon.
    # Positive = node runs ahead. Expected within a few seconds on the
    # external 32.768 kHz crystal; a growing value means the RTC fell back
    # to the internal RC oscillator and scheduled wakes will drift.
    clock_offset:
      name: "RollladenWohnzimmer1 Clock Offset"
      id: rol_1_clock_offset

  - platform: loracover
    lora_client_id: rol_2
    # cover_id: rol_1
    # name: "RollladenWohnzimmer1 Battery"
    # id: rol_1_battery
    # type: BATTERY
    battery_level:
      name: "RollladenWohnzimmer2 Battery Level"
      id: rol_2_battery_level
    battery_voltage:
      name: "RollladenWohnzimmer2 Battery Voltage"
      id: rol_2_battery_voltage
    link_rssi:
      name: "RollladenWohnzimmer2 Link RSSI"
      id: rol_2_link_rssi
    motor_current:
      name: "RollladenWohnzimmer2 Motor Current"
      id: rol_2_motor_current
    # P2: node clock minus hub clock, reported in each wake beacon.
    # Positive = node runs ahead. Expected within a few seconds on the
    # external 32.768 kHz crystal; a growing value means the RTC fell back
    # to the internal RC oscillator and scheduled wakes will drift.
    clock_offset:
      name: "RollladenWohnzimmer2 Clock Offset"
      id: rol_2_clock_offset


switch:
  # Per-slot enable switches — part of the SLOT-ENTITY UI, commented out with
  # the rest of it. In the text format a slot is removed by deleting it from
  # the line, so there is nothing to enable or disable.
  # - platform: loracover
  #   lora_client_id: rol_2
  #   slot: 0
  #   name: "Rol2 Slot 1 Enabled"
  # - platform: loracover
  #   lora_client_id: rol_2
  #   slot: 1
  #   name: "Rol2 Slot 2 Enabled"
  # - platform: loracover
  #   lora_client_id: rol_2
  #   slot: 2
  #   name: "Rol2 Slot 3 Enabled"
  # - platform: loracover
  #   lora_client_id: rol_2
  #   slot: 3
  #   name: "Rol2 Slot 4 Enabled"

  # P4b: automatic-mode control. The switch expresses INTENT — the node still
  # refuses auto mode without a valid clock and a usable schedule, and a button
  # press at the blind flips it back to interactive. The published state is
  # corrected from what the node reports in its wake beacon.
  - platform: loracover
    lora_client_id: rol_1
    name: "RollladenWohnzimmer1 Auto Mode"
    id: rol_1_auto_mode
  - platform: loracover
    lora_client_id: rol_2
    name: "RollladenWohnzimmer2 Auto Mode"
    id: rol_2_auto_mode


binary_sensor:
  - platform: loracover
    lora_client_id: rol_1
    name: "RollladenWohnzimmer1 Command Failed"
    id: rol_1_command_failed
  - platform: loracover
    lora_client_id: rol_2
    name: "RollladenWohnzimmer2 Command Failed"
    id: rol_2_command_failed

  # Briefly true after a schedule edit; persistently true means pushes are not
  # reaching the node.
  - platform: loracover
    lora_client_id: rol_1
    type: schedule_pending
    name: "RollladenWohnzimmer1 Schedule Pending"
    id: rol_1_schedule_pending
  - platform: loracover
    lora_client_id: rol_2
    type: schedule_pending
    name: "RollladenWohnzimmer2 Schedule Pending"
    id: rol_2_schedule_pending

# ---- Schedule editing from Home Assistant (node 2 first) --------------------
#
# Four slots. The `schedule:` list above each client is now a FIRST-BOOT SEED:
# once a slot has been edited in HA the hub persists it and the seed is ignored,
# so an existing schedule is not silently discarded by adding this.
#
# A sleeping node picks an edit up at its next wake (up to checkin_interval) —
# watch the `Schedule Pending` binary sensor for that window.
#
# Rolled out on node 2 only for now: it is the bench unit, and node 1 is still
# on older firmware.
# --- SLOT-ENTITY SCHEDULE UI (kept for comparison; superseded by `text:`) ---
# Twenty entities per node to express what one line of text says. Left here
# so the two can be judged side by side — re-enable by uncommenting and
# commenting out the text: block below.
# datetime:
#   - platform: loracover
#     lora_client_id: rol_2
#     slot: 0
#     name: "Rol2 Slot 1 Time"
#   - platform: loracover
#     lora_client_id: rol_2
#     slot: 1
#     name: "Rol2 Slot 2 Time"
#   - platform: loracover
#     lora_client_id: rol_2
#     slot: 2
#     name: "Rol2 Slot 3 Time"
#   - platform: loracover
#     lora_client_id: rol_2
#     slot: 3
#     name: "Rol2 Slot 4 Time"
#
# --- SLOT-ENTITY SCHEDULE UI (kept for comparison; superseded by `text:`) ---
# Twenty entities per node to express what one line of text says. Left here
# so the two can be judged side by side — re-enable by uncommenting and
# commenting out the text: block below.
# select:
#   - platform: loracover
#     lora_client_id: rol_2
#     slot: 0
#     type: action
#     name: "Rol2 Slot 1 Action"
#   - platform: loracover
#     lora_client_id: rol_2
#     slot: 0
#     type: days
#     name: "Rol2 Slot 1 Days"
#   - platform: loracover
