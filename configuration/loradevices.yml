substitutions:
  devicename: "loradevices"



esphome:
  name: $devicename
  # Example configuration entry

  # comment: "MyBlinds"
  # name_add_mac_suffix: true
  # project:
  #   name: "Blinds"
  #   version: "V0.1"

esp32:
  variant: esp32
  cpu_frequency: 240MHz
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_XTAL_FREQ_26: y
      CONFIG_INT_WDT_TIMEOUT_MS: "800"
      CONFIG_FREERTOS_CHECK_STACKOVERFLOW_CANARY: y
      CONFIG_FREERTOS_WATCHPOINT_END_OF_STACK: y
      # Pinned, not inherited. The transmit burst paces itself with
      # vTaskDelayUntil(pdMS_TO_TICKS(88)), and pdMS_TO_TICKS quantises to the
      # tick: at 1000 Hz that is 88 ms, at 100 Hz it is 80 ms, and an 8 ms
      # per-copy error is 9 % of the stride the node's DriftEstimator regresses
      # against. Nothing in this file previously said what the rate was, so the
      # stride was correct only by inheritance from a default.
      CONFIG_FREERTOS_HZ: "1000"
    # advanced:
    #   loop_task_stack_size: 16384
  
preferences:
  flash_write_interval: 30min    

external_components:
  # use all components from a local folder
  - source:
      type: local
      path: local_components

# Enable logging
logger:


# Enable Home Assistant API
api:

ota:
  platform: esphome
  password: !secret esphome_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: .fritz.box
  fast_connect: on

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${devicename}-AP"

captive_portal:

# see: https://esphome.io/components/time.html
time:
  - platform: homeassistant
    id: homeassistant_time
    on_time:
      - seconds: 0
        minutes: 0
        hours: 23
        days_of_week: MON-SUN
        then:
          - loracover.on_sleep_start: rol_1
          - loracover.on_sleep_start: rol_2



# Enable Web server
web_server:
  port: 80


lora_tracker:
  id: my_lora_tracker


lora_client:
  - id: rol_1
    name: "RollladenWohnzimmer1"
    time_id: homeassistant_time
    short_address: 17
    subnet_address: 02
    sleep_duration: 21600
    battery_update_interval: 15min
    mac_address: e0:8c:fe:5f:b7:a4
    # P4: automatic (scheduled) mode.
    #
    # Back to FALSE (interactive) as the seed. Auto mode has been proven in
    # production (21:45 close and 06:00 open both fired), but a node in auto
    # mode SLEEPS, and a sleeping node cannot be reached for an OTA or a drift
    # test without a physical button press at the blind. Interactive is the
    # right default while the drift work is in progress.
    #
    # NOTE: this is only the FIRST-BOOT seed. Once a schedule has been stored,
    # load_schedule_() restores the persisted mode and logs "YAML seed
    # ignored" — so changing this line does NOT flip a hub that already has
    # AUTO in flash. Use the Auto Mode switch in HA for that.
    auto_mode: false
    interactive_timeout: 30min
    checkin_interval: 6h
    catchup_window: 0min
    schedule:
      - time: "06:00:00"
        days: weekdays
        action: open
      - time: "07:30:00"
        days: weekend
        action: open
      - time: "21:45:00"
        days: daily
        action: close
      # - time: "12:00:00"
      #   days: sat
      #   action: position
      #   position: 40


  - id: rol_2
    name: "RollladenWohnzimmer2"
    time_id: homeassistant_time
    short_address: 18
    subnet_address: 02
    sleep_duration: 21600
    battery_update_interval: 15min
    mac_address: e0:8c:fe:5f:9e:c4
    # ---- node 2, bench unit ----
    # The auto-mode trial succeeded here (both scheduled events fired).
    #
    # Seeded INTERACTIVE: this is the node the drift test runs on, and the test
    # needs it awake and listening. See the note on node 1 — this seed is
    # ignored once a schedule is stored, so the HA switch is the live control.
    auto_mode: false
    interactive_timeout: 30min
    # 1 h rather than node 1's 6 h: this is the BENCH unit, and a check-in is
    # the only way to observe a wake end to end. Six hours between samples made
    # every protocol change a next-day question.
    #
    # Affordable because of the sleepOk flag: a check-in wake costs ~7.7 s
    # instead of 28 s, so hourly is 185 s/day of awake time against six-hourly's
    # 112 s. Before that change it would have been 672 s. See
    # docs/wake-cost-proposal.md.
    #
    # Node 1 deliberately stays at 6 h — it has no serial, so it cannot provide
    # the observability this spends battery on, and its pack is the weaker one.
    checkin_interval: 1h
    catchup_window: 0min
    # Two events eight minutes apart so one run observes both a first entry
    # into auto mode AND a wake out of deep sleep with the RTC markers already
    # valid — which is the case the boot forensics were added to read.
    schedule:
      - time: "21:45:00"
        days: daily
        action: close
      - time: "06:00:00"
        days: daily
        action: open

#mac_address: c4:9e:5f:fe:8c:e0


cover:
  - platform: loracover
    lora_client_id: rol_1
    name: "RollladenWohnzimmer1"
    id: rol_1_cover
    invert_position: false
    # Bar-travel-only times (top <-> sill). Slats nest/un-nest at the sill:
    #   open_slack  = un-seal run before travel when opening from fully closed
    #   close_slack = seal run budget after travel reaches 0 on a full close
    # Starting estimates — recalibrate with a stopwatch.
    open_duration: 38
    close_duration: 36
    open_slack: 7
    close_slack: 7
    blind_height_mm: 2000.0
    axle_diameter_mm: 60.0
    blind_thickness_mm: 8.0

  - platform: loracover
    lora_client_id: rol_2
    name: "RollladenWohnzimmer2"
    id: rol_2_cover
    invert_position: false
    open_duration: 42
    close_duration: 38
    open_slack: 7
    close_slack: 7
    blind_height_mm: 2000.0
    axle_diameter_mm: 60.0
    blind_thickness_mm: 8.0



button:
  - platform: restart
    name: "Hub Restart"
    id: hub_restart
  - platform: loracover
    lora_client_id: rol_1
    name: "Trigger OTA1"
    id: rol_1_trigger_ota_button
    # type: trigger_ota
  - platform: loracover
    lora_client_id: rol_2
    name: "Trigger OTA2"
    id: rol_2_trigger_ota_button
    # type: trigger_ota

  # --- Clock-drift characterisation (bench only) ---------------------------
  # Puts both ends into test mode: the node holds continuous RX, the hub emits
  # a burst every 15 s as a regular ruler. The node then regresses the arrival
  # times of the 17 copies against their known 88000 us spacing; the slope is
  # the relative drift.
  #
  # 88000, NOT 1500/17 = 88235. This comment said 88235 and that is the exact
  # error that cost three firmware revisions: the hub's stride is
  # `roundDurationMs / txSlotsPerRound` in C++ integer arithmetic, so it is 88
  # ms exactly, and the node compiles kCopySpacingUs = 88000 to match. A ruler
  # believed to be 88235 against copies actually 88000 apart reads as a
  # -2663 ppm clock error that does not exist. Result appears in the node's serial log as
  # "DriftTest result: +N ppm over M bursts".
  #
  # Continuous RX costs ~11 mA against the ~1.2 mA interactive average, so this
  # is NOT something to leave running. Both ends stop themselves after 5 min,
  # and the node's timeout is independent of the hub — if the hub goes away
  # mid-test the node still exits.
  - platform: template
    name: "Drift Test Start (node 2)"
    id: rol_2_drift_start
    entity_category: diagnostic
    on_press:
      # 1100 ms, deliberately NOT a multiple of the node's 500 ms RX interval.
      # Commensurate periods phase-lock: a 1000 ms grid against 500 ms windows
      # keeps a constant phase relationship, so if a frame starts landing in the
      # node's RX-off gap it does so forever. Observed exactly that — ~300 grid
      # frames heard, zero. Belt and braces: the node is in continuous RX by the
      # time the grid starts, so this should not matter.
      - lambda: 'id(rol_2)->start_drift_test(300, 1100);'
  - platform: template
    name: "Drift Test Stop (node 2)"
    id: rol_2_drift_stop
    entity_category: diagnostic
    on_press:
      - lambda: 'id(rol_2)->stop_drift_test();'

  # --- ModeTest: on-hardware validation of a mode (test-plan.md section 10) ---
  #
  # Distinct from the drift test above, which measures ONE thing (relative clock
  # rate) with the power profile disabled. ModeTest runs under the PRODUCTION
  # profile by default and reports the frame funnel, the window decisions and
  # four timing distributions, so a mode's claims can be checked against the
  # mode as it actually ships. The report is logged by the hub, recomputed from
  # the node's RAW counters — the node never gets to grade itself.
  #
  # The node refuses to arm without a session, refuses MODE_SWEEP unless it is
  # flagged as a bench node, and owns its own deadline: if the hub disappears
  # mid-test the node still exits and restores everything, its MODE included.
  #
  # Arguments: (duration_s, grid_ms, mode, copies, keepPowerProfile,
  #             enableCounter, enableCrypto, macEcho, armOffsetUs)
  # mode: 0 leave alone, 1 A, 2 B, 3 C, 4 SWEEP.
  - platform: template
    name: "Mode Test A — MAC-0 baseline (node 2)"
    id: rol_2_modetest_a
    entity_category: diagnostic
    on_press:
      # 1093 ms, NOT 1100. MEASURED 2026-09-12: at 1100 ms the hub sent 277
      # marks and the node detected ONE. Phase-locking is governed by the gcd,
      # not by divisibility — marks land at (k * grid) mod 500, a lattice of
      # step gcd(grid, 500) that never grows. 1100 gives gcd 100 ms, i.e. five
      # fixed phases forever; against a 29.44 ms window they cover 147 ms of
      # the 500 ms interval, so ~71 % of runs hear nothing at all and the rest
      # hear 1 mark in 5. 1093 gives gcd 1 ms: the phase walks 93 ms per mark
      # and sweeps every residue. The node now REFUSES the phase-locked case
      # (ModeTestPolicy.h periodsPhaseLock) instead of measuring an empty
      # denominator.
      #
      # Both sublayers off and macEcho on: this is the baseline every other run
      # is a delta against. A MAC echo measures RxDone -> TX fire and nothing
      # else, which is what section 4.3's servable-slot rule needs and cannot
      # get from a command the application answers.
      - lambda: 'id(rol_2)->start_mode_test(300, 1093, 1, 1, true, false, false, true);'
  - platform: template
    name: "Mode Test A — with MAC-1 counter (node 2)"
    id: rol_2_modetest_a_counter
    entity_category: diagnostic
    on_press:
      # Identical grid, counter ON. The DIFFERENCE against the baseline is
      # MAC-1's cost — measured, not estimated. Run them back to back.
      - lambda: 'id(rol_2)->start_mode_test(300, 1093, 1, 1, true, true, false, true);'
  - platform: template
    name: "Mode Test A — with MAC-1 + MAC-2 (node 2)"
    id: rol_2_modetest_a_crypto
    entity_category: diagnostic
    on_press:
      - lambda: 'id(rol_2)->start_mode_test(300, 1093, 1, 1, true, true, true, true);'
  - platform: template
    name: "Mode Test B — timed windows (node 2)"
    id: rol_2_modetest_b
    entity_category: diagnostic
    on_press:
      # In MODE_B the incommensurability rule INVERTS: the period must be
      # exactly the round and phase-locked to the node's slot. That is the mode.
      - lambda: 'id(rol_2)->start_mode_test(300, 1500, 2, 1, true, false, false, true);'
  - platform: template
    name: "Mode Test Stop (node 2)"
    id: rol_2_modetest_stop
    entity_category: diagnostic
    on_press:
      - lambda: 'id(rol_2)->stop_mode_test();'

  # HW-2, the B3 blocker: sweep the ARM instant late in 500 us steps until
  # reception fails. The failure edge gives T_detect directly, because a window
  # armed `l` late catches the frame iff l <= G. BENCH NODE ONLY — the node
  # refuses this outright otherwise, since it deliberately mis-arms windows.
  #
  # Run one press per offset and read the funnel in the report. The early edge
  # (negative offsets) returns G independently, and the two must sum to
  # N*T_sym - T_detect; SweepAnalysis.h does that arithmetic.
  - platform: template
    name: "Mode Sweep +4 ms (node 2, BENCH ONLY)"
    id: rol_2_modesweep_p4
    entity_category: diagnostic
    on_press:
      - lambda: 'id(rol_2)->start_mode_test(120, 1100, 4, 1, true, false, false, true, 4000);'
  - platform: template
    name: "Mode Sweep +12 ms (node 2, BENCH ONLY)"
    id: rol_2_modesweep_p12
    entity_category: diagnostic
    on_press:
      - lambda: 'id(rol_2)->start_mode_test(120, 1100, 4, 1, true, false, false, true, 12000);'
  - platform: template
    name: "Mode Sweep -12 ms (node 2, BENCH ONLY)"
    id: rol_2_modesweep_m12
    entity_category: diagnostic
    on_press:
      - lambda: 'id(rol_2)->start_mode_test(120, 1100, 4, 1, true, false, false, true, -12000);'

  # --- MAC-0 ping / echo (mac-layer.md sections 5 and 6) --------------------
  #
  # The one test mode that had no control at all: start_mac_ping() and
  # stop_mac_ping() were written and had zero callers, so the mode existed and
  # could not be run.
  #
  # It is the only way to measure TURNAROUND honestly. A MAC control frame is
  # answered by MAC-0 itself, with no application message in either direction,
  # so what it times is RxDone -> TX fire and nothing else. Every other exchange
  # this system has carries a cover operation or a schedule somewhere inside it,
  # and a turnaround measured that way silently includes application dispatch.
  #
  # It is also where stage 0 of the frame funnel comes from. Only the SENDER
  # knows what it offered, so the node can never compute its own frame-error
  # rate — it cannot know what it did not hear.
  #
  # One copy per mark, not a burst: seventeen copies of one mark is not one
  # mark. 1100 ms for the same incommensurability reason as the drift test.
  - platform: template
    name: "MAC Ping Start (node 2)"
    id: rol_2_mac_ping_start
    entity_category: diagnostic
    on_press:
      - lambda: 'id(rol_2)->start_mac_ping(300, 1100, true, 0);'
  - platform: template
    name: "MAC Ping Stop (node 2)"
    id: rol_2_mac_ping_stop
    entity_category: diagnostic
    on_press:
      - lambda: 'id(rol_2)->stop_mac_ping();'
  - platform: template
    name: "MAC Ping Reset Counters (node 2)"
    id: rol_2_mac_ping_reset
    entity_category: diagnostic
    on_press:
      - lambda: 'id(rol_2)->reset_mac_stats();'

sensor:
  # --- ModeTest and MAC-ping results, as numbers ---------------------------
  #
  # The hub already recomputes these from the node's RAW counters (I1: the node
  # never grades itself) and logs them in one line. The line is for a console;
  # these are for Home Assistant, where B3's gate actually lives — "reception
  # >= Mode A over a week" is a week of HISTORY, and a log line cannot be
  # graphed. A single text_sensor could not carry it either: HA caps a state at
  # 255 characters and the report line is up to 512, so it would truncate
  # silently, which is the trap the `help` entity already fell into once.
  #
  # update_interval is slow on purpose: a report arrives at the END of a run
  # (300 s by default), so polling faster only costs entity churn.
  - platform: template
    name: "Mode Test — mode actually run (node 2)"
    id: rol_2_mt_mode
    entity_category: diagnostic
    update_interval: 30s
    accuracy_decimals: 0
    # 1 = A, 2 = B, 4 = SWEEP. DERIVED from what the node applied, not from
    # what the button asked for: mode was echoed from the request until this
    # session, so every "Mode Test B" number ever taken described Mode A.
    lambda: 'return id(rol_2)->mode_test_summary().valid
                 ? (float) id(rol_2)->mode_test_summary().mode
                 : NAN;'
  - platform: template
    name: "Mode Test — arm refusal (node 2)"
    id: rol_2_mt_refusal
    entity_category: diagnostic
    update_interval: 30s
    accuracy_decimals: 0
    # 0 = armed. Anything else and the run below describes nothing: see
    # ModeTestPolicy.h's ArmRefusal.
    lambda: 'return id(rol_2)->mode_test_summary().valid
                 ? (float) id(rol_2)->mode_test_summary().arm_refusal
                 : NAN;'
  - platform: template
    name: "Mode Test — windows armed (node 2)"
    id: rol_2_mt_windows_armed
    entity_category: diagnostic
    update_interval: 30s
    accuracy_decimals: 0
    # The witness for whether Mode B actually RAN. Enabling timed RX makes the
    # mode reachable; timedRxActive() re-runs the promotion test at every mark,
    # so a node whose phase never becomes trustworthy reports mode = 2 over
    # marks it never armed. This reads 0 when that happened — and WMR cannot
    # say so, because a zero denominator gives 0 ppm, the same number a
    # flawless run gives.
    lambda: 'return id(rol_2)->mode_test_summary().valid
                 ? (float) id(rol_2)->mode_test_summary().windows_armed
                 : NAN;'
  - platform: template
    name: "Mode Test — windows hit (node 2)"
    id: rol_2_mt_windows_hit
    entity_category: diagnostic
    update_interval: 30s
    accuracy_decimals: 0
    lambda: 'return id(rol_2)->mode_test_summary().valid
                 ? (float) id(rol_2)->mode_test_summary().windows_hit
                 : NAN;'
  - platform: template
    name: "Mode Test — FER link (node 2)"
    id: rol_2_mt_fer_link
    entity_category: diagnostic
    unit_of_measurement: "ppm"
    update_interval: 30s
    accuracy_decimals: 0
    # The honest denominator is the node's own seqFirst..seqLast span, not the
    # hub's count: dividing by what the hub queued before the node started
    # listening would report the node's late arrival as packet loss.
    lambda: 'return id(rol_2)->mode_test_summary().valid
                 ? (float) id(rol_2)->mode_test_summary().fer_link_ppm
                 : NAN;'
  - platform: template
    name: "Mode Test — window miss rate (node 2)"
    id: rol_2_mt_wmr
    entity_category: diagnostic
    unit_of_measurement: "ppm"
    update_interval: 30s
    accuracy_decimals: 0
    # Read this WITH windows armed above, never alone.
    lambda: 'return id(rol_2)->mode_test_summary().valid
                 ? (float) id(rol_2)->mode_test_summary().wmr_ppm
                 : NAN;'
  - platform: template
    name: "Mode Test — phase error p99 (node 2)"
    id: rol_2_mt_phase_p99
    entity_category: diagnostic
    unit_of_measurement: "us"
    update_interval: 30s
    accuracy_decimals: 0
    # Against the guard band of 14080 us. p99 rather than a mean, because the
    # tail is the thing: a mean would hide exactly the excursions that miss a
    # window.
    lambda: 'return id(rol_2)->mode_test_summary().valid
                 ? (float) id(rol_2)->mode_test_summary().phase_p99_us
                 : NAN;'
  - platform: template
    name: "Mode Test — turnaround p99 (node 2)"
    id: rol_2_mt_turnaround_p99
    entity_category: diagnostic
    unit_of_measurement: "us"
    update_interval: 30s
    accuracy_decimals: 0
    # Section 4.3's servable-slot rule is priced against this.
    lambda: 'return id(rol_2)->mode_test_summary().valid
                 ? (float) id(rol_2)->mode_test_summary().turnaround_p99_us
                 : NAN;'

  # U-2: windows the node MEANT to open and never did, because its radio was
  # still busy when the mark came round. Not a ModeTest number — it is counted
  # continuously and rides every PhaseReport, so it is live rather than
  # per-run.
  #
  # READ IT BESIDE the window miss rate above, never instead of it. A mark that
  # was never armed is invisible to WMR by construction, because noteMarkArmed()
  # is what opens a mark at all: a node whose radio is wedged reports a flawless
  # WMR while hearing nothing. This is the number that says so, and it is why a
  # perfect miss rate is not on its own evidence of a working link.
  #
  # NAN until a PhaseReport has arrived, so "this node has not answered" does
  # not plot as a flat clean zero. It does NOT distinguish firmware without the
  # field — rxBusySkips is a proto3 scalar, so absent and 0 are the same bytes
  # on the air. Nothing is deployed yet, so no such firmware exists to confuse
  # it with.
  - platform: template
    name: "RX windows skipped — radio busy (node 2)"
    id: rol_2_rx_busy_skips
    entity_category: diagnostic
    update_interval: 30s
    accuracy_decimals: 0
    lambda: 'return id(rol_2)->node_rx_busy_skips().valid
                 ? (float) id(rol_2)->node_rx_busy_skips().count
                 : NAN;'

  # T-2: frames the HUB refused because its transmit buffer pool was empty.
  #
  # The pool is POOL_SIZE = 5 and the handoff queue is 20, but nothing enters
  # the queue without a buffer and a PLACED frame holds its buffer from send()
  # until its mark — so the pool, not the queue, is the real depth. A
  # fleet-wide push places one frame per node with all 32 marks inside one
  # round, and the sixth onwards is refused.
  #
  # Refusal is handled rather than silent: the node's mark is not consumed, the
  # schedule push has an ack-driven retry, and BaseNonceExchange keeps the
  # previous nonce so the session survives. This number is how you find out it
  # is happening at all — it is tracker-wide, not per node, because the pool is.
  - platform: template
    name: "Transmit pool exhausted — frames refused"
    id: lora_pool_refusals
    entity_category: diagnostic
    update_interval: 30s
    accuracy_decimals: 0
    lambda: 'return (float) id(my_lora_tracker)->poolAllocationFailures();'

  # U-1: whether this node is on ONE copy per frame or seventeen.
  #
  # This is what the whole of Mode B buys — a 17x airtime reduction on every
  # addressed downlink — and until now it was visible only in an ESPHome log
  # line, so nobody could see whether a fleet was actually getting it.
  #
  # Two entities, deliberately. The boolean says what is happening; the reason
  # below says why, and the reason is the one you act on. "Single shot: no" on
  # a node you expected to be promoted tells you nothing about whether it needs
  # a crystal, a longer baseline, or simply more time.
  - platform: template
    name: "Single shot active (node 2)"
    id: rol_2_single_shot
    entity_category: diagnostic
    update_interval: 30s
    accuracy_decimals: 0
    lambda: 'return id(rol_2)->txPolicyNow() == timedmode::TxPolicy::SingleShot
                 ? 1.0f : 0.0f;'

  # Why it is still bursting, from the same ladder the decision comes out of —
  # see TimedModePolicy.h's TxRefusal. 0 means it is not.
  #
  #  1 no grid           6 rule 4: a single shot went unacked
  #  2 rebooted          7 no phase report yet
  #  3 new session       8 not on the external crystal
  #  4 beacon missed     9 phase baseline too short
  #  5 firmware unknown 10 phase mean outside the guard band
  #                     11 phase spread too wide (bimodal)
  #                     12 the node scored samples outside the guard
  #                     13 the hub published no resyncMaxS
  #                     14 the confirmation has gone stale
  #
  # The numbers are a wire format now that they are published here: append to
  # the enum, never renumber.
  - platform: template
    name: "Single shot refused — reason (node 2)"
    id: rol_2_single_shot_refusal
    entity_category: diagnostic
    update_interval: 30s
    accuracy_decimals: 0
    lambda: 'return (float) (uint8_t) id(rol_2)->txRefusalNow();'

  # U-5: the node has missed a check-in the hub PREDICTED it would make.
  #
  # The prediction is next_wake_epoch_(), which the hub already computes from
  # the node's own vendored scheduler so it does not transmit at a sleeping
  # node — the comparison against what was actually observed is all that was
  # missing. It gates single-shot (refusal reason 4 above) and is published
  # here because "this node has gone quiet" is a thing an operator acts on
  # directly.
  #
  # 0 for a node the hub cannot predict — never heard from, or no hub clock.
  # A prediction that cannot be made must not read as a failure.
  - platform: template
    name: "Node overdue — missed a predicted check-in (node 2)"
    id: rol_2_overdue
    entity_category: diagnostic
    update_interval: 30s
    accuracy_decimals: 0
    lambda: 'return id(rol_2)->node_overdue() ? 1.0f : 0.0f;'

  # MAC ping, stage 0 of the funnel. pings_offered is the only number in this
  # system that the HUB alone can know.
  - platform: template
    name: "MAC Ping — offered (node 2)"
    id: rol_2_macping_offered
    entity_category: diagnostic
    update_interval: 30s
    accuracy_decimals: 0
    lambda: 'return (float) id(rol_2)->mac_stats().pings_offered;'
  - platform: template
    name: "MAC Ping — echoes received (node 2)"
    id: rol_2_macping_echoes
    entity_category: diagnostic
    update_interval: 30s
    accuracy_decimals: 0
    lambda: 'return (float) id(rol_2)->mac_stats().echoes_rx;'
  - platform: template
    name: "MAC Ping — echo gaps (node 2)"
    id: rol_2_macping_gaps
    entity_category: diagnostic
    update_interval: 30s
    accuracy_decimals: 0
    # Marks with no echo, counted by SEQUENCE rather than by absence: a gap is
    # a mark the node did not answer, which is not the same as a slow one.
    lambda: 'return (float) id(rol_2)->mac_stats().echo_seq_gaps;'

  - platform: uptime
    name: '${devicename} Uptime'
    unit_of_measurement: days
    update_interval: 300s
    filters:
      - multiply: 0.000011574

  - platform: wifi_signal
    name: '${devicename} WiFi Signal'
    update_interval: 300s

  - platform: loracover
    lora_client_id: rol_1
    # cover_id: rol_1
    # name: "RollladenWohnzimmer1 Battery"
    # id: rol_1_battery
    # type: BATTERY
    battery_level:
      name: "RollladenWohnzimmer1 Battery Level"
      id: rol_1_battery_level
    battery_voltage:
      name: "RollladenWohnzimmer1 Battery Voltage"
      id: rol_1_battery_voltage
    link_rssi:
      name: "RollladenWohnzimmer1 Link RSSI"
      id: rol_1_link_rssi
    motor_current:
      name: "RollladenWohnzimmer1 Motor Current"
      id: rol_1_motor_current
    # P2: node clock minus hub clock, reported in each wake beacon.
    # Positive = node runs ahead. Expected within a few seconds on the
    # external 32.768 kHz crystal; a growing value means the RTC fell back
    # to the internal RC oscillator and scheduled wakes will drift.
    clock_offset:
      name: "RollladenWohnzimmer1 Clock Offset"
      id: rol_1_clock_offset

  - platform: loracover
    lora_client_id: rol_2
    # cover_id: rol_1
    # name: "RollladenWohnzimmer1 Battery"
    # id: rol_1_battery
    # type: BATTERY
    battery_level:
      name: "RollladenWohnzimmer2 Battery Level"
      id: rol_2_battery_level
    battery_voltage:
      name: "RollladenWohnzimmer2 Battery Voltage"
      id: rol_2_battery_voltage
    link_rssi:
      name: "RollladenWohnzimmer2 Link RSSI"
      id: rol_2_link_rssi
    motor_current:
      name: "RollladenWohnzimmer2 Motor Current"
      id: rol_2_motor_current
    # P2: node clock minus hub clock, reported in each wake beacon.
    # Positive = node runs ahead. Expected within a few seconds on the
    # external 32.768 kHz crystal; a growing value means the RTC fell back
    # to the internal RC oscillator and scheduled wakes will drift.
    clock_offset:
      name: "RollladenWohnzimmer2 Clock Offset"
      id: rol_2_clock_offset


switch:
  # --- B3: put a node into Mode B (timed windows) ---------------------------
  #
  # THE ENTRY POINT THAT WAS MISSING. Until this existed, send_grid_sync(true)
  # was never called from anywhere and set_grid_aligned() had no callers, so no
  # node could be told to adopt a grid however correct the node's own code was —
  # and HW-2's sweep could not run either, because it needs a GridSync carrying
  # armOffsetUs and the hub emitted none.
  #
  # Default OFF, and a deliberate opt-in rather than automatic promotion:
  # T_detect is still unmeasured, so the guard band Mode B rests on is an
  # assumption, and alignment costs up to 1.5 s of latency until the timed
  # window exists.
  #
  # Turning this on makes Mode B REACHABLE, not active — the node's own policy
  # still gates promotion on ppm validity, phase trustworthiness, missed marks
  # and the RTC source.
  - platform: template
    name: "Timed Mode (Mode B) — node 2"
    id: rol_2_timed_mode
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: 'id(rol_2)->enable_timed_mode(true);'
    turn_off_action:
      - lambda: 'id(rol_2)->enable_timed_mode(false);'

  # Per-slot enable switches — part of the SLOT-ENTITY UI, commented out with
  # the rest of it. In the text format a slot is removed by deleting it from
  # the line, so there is nothing to enable or disable.
  # - platform: loracover
  #   lora_client_id: rol_2
  #   slot: 0
  #   name: "Rol2 Slot 1 Enabled"
  # - platform: loracover
  #   lora_client_id: rol_2
  #   slot: 1
  #   name: "Rol2 Slot 2 Enabled"
  # - platform: loracover
  #   lora_client_id: rol_2
  #   slot: 2
  #   name: "Rol2 Slot 3 Enabled"
  # - platform: loracover
  #   lora_client_id: rol_2
  #   slot: 3
  #   name: "Rol2 Slot 4 Enabled"

  # P4b: automatic-mode control. The switch expresses INTENT — the node still
  # refuses auto mode without a valid clock and a usable schedule, and a button
  # press at the blind flips it back to interactive. The published state is
  # corrected from what the node reports in its wake beacon.
  - platform: loracover
    lora_client_id: rol_1
    name: "RollladenWohnzimmer1 Auto Mode"
    id: rol_1_auto_mode
  - platform: loracover
    lora_client_id: rol_2
    name: "RollladenWohnzimmer2 Auto Mode"
    id: rol_2_auto_mode


binary_sensor:
  - platform: loracover
    lora_client_id: rol_1
    name: "RollladenWohnzimmer1 Command Failed"
    id: rol_1_command_failed
  - platform: loracover
    lora_client_id: rol_2
    name: "RollladenWohnzimmer2 Command Failed"
    id: rol_2_command_failed

  # Briefly true after a schedule edit; persistently true means pushes are not
  # reaching the node.
  - platform: loracover
    lora_client_id: rol_1
    type: schedule_pending
    name: "RollladenWohnzimmer1 Schedule Pending"
    id: rol_1_schedule_pending
  - platform: loracover
    lora_client_id: rol_2
    type: schedule_pending
    name: "RollladenWohnzimmer2 Schedule Pending"
    id: rol_2_schedule_pending

# ---- Schedule editing from Home Assistant (node 2 first) --------------------
#
# Four slots. The `schedule:` list above each client is now a FIRST-BOOT SEED:
# once a slot has been edited in HA the hub persists it and the seed is ignored,
# so an existing schedule is not silently discarded by adding this.
#
# A sleeping node picks an edit up at its next wake (up to checkin_interval) —
# watch the `Schedule Pending` binary sensor for that window.
#
# Rolled out on node 2 only for now: it is the bench unit, and node 1 is still
# on older firmware.
# --- SLOT-ENTITY SCHEDULE UI (kept for comparison; superseded by `text:`) ---
# Twenty entities per node to express what one line of text says. Left here
# so the two can be judged side by side — re-enable by uncommenting and
# commenting out the text: block below.
# datetime:
#   - platform: loracover
#     lora_client_id: rol_2
#     slot: 0
#     name: "Rol2 Slot 1 Time"
#   - platform: loracover
#     lora_client_id: rol_2
#     slot: 1
#     name: "Rol2 Slot 2 Time"
#   - platform: loracover
#     lora_client_id: rol_2
#     slot: 2
#     name: "Rol2 Slot 3 Time"
#   - platform: loracover
#     lora_client_id: rol_2
#     slot: 3
#     name: "Rol2 Slot 4 Time"
#
# --- SLOT-ENTITY SCHEDULE UI (kept for comparison; superseded by `text:`) ---
# Twenty entities per node to express what one line of text says. Left here
# so the two can be judged side by side — re-enable by uncommenting and
# commenting out the text: block below.
# select:
#   - platform: loracover
#     lora_client_id: rol_2
#     slot: 0
#     type: action
#     name: "Rol2 Slot 1 Action"
#   - platform: loracover
#     lora_client_id: rol_2
#     slot: 0
#     type: days
#     name: "Rol2 Slot 1 Days"
