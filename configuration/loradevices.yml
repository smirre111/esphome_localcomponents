    battery_calib_actual_run:
      name: "RollladenWohnzimmer2 Battery Calib Actual Run"
      id: rol_2_calib_actual_run
    battery_calib_nominal_run:
      name: "RollladenWohnzimmer2 Battery Calib Nominal Run"
