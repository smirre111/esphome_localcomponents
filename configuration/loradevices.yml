switch:
  # --- B3: put a node into Mode B (timed windows) ---------------------------
  #
  # THE ENTRY POINT THAT WAS MISSING. Until this existed, send_grid_sync(true)
  # was never called from anywhere and set_grid_aligned() had no callers, so no
  # node could be told to adopt a grid however correct the node's own code was —
  # and HW-2's sweep could not run either, because it needs a GridSync carrying
  # armOffsetUs and the hub emitted none.
  #
  # Default OFF, and a deliberate opt-in rather than automatic promotion:
  # T_detect is still unmeasured, so the guard band Mode B rests on is an
  # assumption, and alignment costs up to 1.5 s of latency until the timed
  # window exists.
  #
  # Turning this on makes Mode B REACHABLE, not active — the node's own policy
  # still gates promotion on ppm validity, phase trustworthiness, missed marks
  # and the RTC source.
  - platform: template
    name: "Timed Mode (Mode B) — Node 2"
    id: rol_2_timed_mode
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: 'id(rol_2)->enable_timed_mode(true);'
    turn_off_action:
      - lambda: 'id(rol_2)->enable_timed_mode(false);'

  - platform: template
    name: "Timed Mode (Mode B) — Node 1"
    id: rol_1_timed_mode
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: 'id(rol_1)->enable_timed_mode(true);'
    turn_off_action:
      - lambda: 'id(rol_1)->enable_timed_mode(false);'

  # OPTIMISTIC SINGLE SHOT (nodes 2 and 1). Default OFF, and the default is the point.
  # Enabled 2026-10-06 as an OPT-IN for the soak: RESTORE_DEFAULT_OFF, so a switch
  # turned on survives a hub reboot and a fresh install stays off. A wrong guess
  # is found out after ~500 ms + the time to the node's mark, not 3 s, and that
  # miss is not counted against the 4-retry session-teardown budget
  # (lora_client/SingleShotAckWait.h).
  #
  # When the ONLY rung refusing single shot is that the hub's confirmation has
  # aged out (ConfirmationStale), the hub spends ONE placed copy instead of a
  # 17-copy burst and lets §4.6 Rule 4 cover a wrong guess: an unacked single
  # shot is retried as a burst immediately, so being wrong costs one frame.
  #
  #   expected = p x 42 ms + (1 - p) x 757 ms, against 715 ms always
  #   break-even at p = 6 %
  #
  # Measured 2026-09-21: a node genuinely in Mode B hit 198/198 and 194/194
  # windows at WMR 0 ppm, so p is near 1 when it really is promoted and near
  # the Mode A free-running catch rate (~6 %) when it is not — which IS the
  # break-even, so the change is close to free even when the optimism is wrong.
  #
  # NOT §4.4's rejected keepalive: that was a PERIODIC unicast at 5.8 min,
  # 274.5 s/day at 32 nodes, 3.4x worse than all-burst. This is demand-driven
  # and costs nothing while the fleet is idle.
  #
  # It never bypasses positive evidence that the node moved — no grid, reboot,
  # new session, missed beacon, unknown firmware, Rule 4, node-not-timed all
  # still burst — and it does NOT bypass NoPhaseReport, which would be inert
  # (node_timed_rx rides the same report) and unsafe.
  #
  # A switch rather than automatic, for the same reason Timed Mode above is:
  # it relaxes "any hub uncertainty -> burst", which is the safety argument.
  - platform: template
    name: "Optimistic single shot (node 2)"
    id: rol_2_optimistic_single_shot
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: 'id(rol_2)->enable_optimistic_single_shot(true);'
    turn_off_action:
      - lambda: 'id(rol_2)->enable_optimistic_single_shot(false);'

  - platform: template
    name: "Optimistic single shot (node 1)"
    id: rol_1_optimistic_single_shot
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: 'id(rol_1)->enable_optimistic_single_shot(true);'
    turn_off_action:
      - lambda: 'id(rol_1)->enable_optimistic_single_shot(false);'

  # Per-slot enable switches — part of the SLOT-ENTITY UI, commented out with
  # the rest of it. In the text format a slot is removed by deleting it from
  # the line, so there is nothing to enable or disable.
  # - platform: loracover
  #   lora_client_id: rol_2
  #   slot: 0
  #   name: "Rol2 Slot 1 Enabled"
  # - platform: loracover
  #   lora_client_id: rol_2
  #   slot: 1
  #   name: "Rol2 Slot 2 Enabled"
  # - platform: loracover
  #   lora_client_id: rol_2
  #   slot: 2
  #   name: "Rol2 Slot 3 Enabled"
  # - platform: loracover
  #   lora_client_id: rol_2
  #   slot: 3
  #   name: "Rol2 Slot 4 Enabled"

  # P4b: automatic-mode control. The switch expresses INTENT — the node still
  # refuses auto mode without a valid clock and a usable schedule, and a button
  # press at the blind flips it back to interactive. The published state is
  # corrected from what the node reports in its wake beacon.
  - platform: loracover
    lora_client_id: rol_1
    name: "RollladenWohnzimmer1 Auto Mode"
    id: rol_1_auto_mode
  - platform: loracover
    lora_client_id: rol_2
    name: "RollladenWohnzimmer2 Auto Mode"
    id: rol_2_auto_mode


binary_sensor:
  - platform: loracover
    lora_client_id: rol_1
    name: "RollladenWohnzimmer1 Command Failed"
    id: rol_1_command_failed
  - platform: loracover
    lora_client_id: rol_2
    name: "RollladenWohnzimmer2 Command Failed"
    id: rol_2_command_failed

  # Briefly true after a schedule edit; persistently true means pushes are not
  # reaching the node.
  - platform: loracover
    lora_client_id: rol_1
    type: schedule_pending
    name: "RollladenWohnzimmer1 Schedule Pending"
    id: rol_1_schedule_pending
  - platform: loracover
    lora_client_id: rol_2
    type: schedule_pending
    name: "RollladenWohnzimmer2 Schedule Pending"
    id: rol_2_schedule_pending

# ---- Schedule editing from Home Assistant (node 2 first) --------------------
#
# Four slots. The `schedule:` list above each client is now a FIRST-BOOT SEED:
# once a slot has been edited in HA the hub persists it and the seed is ignored,
# so an existing schedule is not silently discarded by adding this.
#
# A sleeping node picks an edit up at its next wake (up to checkin_interval) —
# watch the `Schedule Pending` binary sensor for that window.
#
# Rolled out on node 2 only for now: it is the bench unit, and node 1 is still
# on older firmware.
# --- SLOT-ENTITY SCHEDULE UI (kept for comparison; superseded by `text:`) ---
# Twenty entities per node to express what one line of text says. Left here
# so the two can be judged side by side — re-enable by uncommenting and
# commenting out the text: block below.
# datetime:
#   - platform: loracover
#     lora_client_id: rol_2
#     slot: 0
#     name: "Rol2 Slot 1 Time"
#   - platform: loracover
#     lora_client_id: rol_2
#     slot: 1
#     name: "Rol2 Slot 2 Time"
#   - platform: loracover
#     lora_client_id: rol_2
#     slot: 2
#     name: "Rol2 Slot 3 Time"
#   - platform: loracover
#     lora_client_id: rol_2
#     slot: 3
#     name: "Rol2 Slot 4 Time"
#
# --- SLOT-ENTITY SCHEDULE UI (kept for comparison; superseded by `text:`) ---
# Twenty entities per node to express what one line of text says. Left here
# so the two can be judged side by side — re-enable by uncommenting and
# commenting out the text: block below.
# select:
#   - platform: loracover
#     lora_client_id: rol_2
#     slot: 0
#     type: action
#     name: "Rol2 Slot 1 Action"
#   - platform: loracover
#     lora_client_id: rol_2
#     slot: 0
#     type: days
#     name: "Rol2 Slot 1 Days"
#   - platform: loracover
#     lora_client_id: rol_2
#     slot: 1
#     type: action
#     name: "Rol2 Slot 2 Action"
#   - platform: loracover
#     lora_client_id: rol_2
#     slot: 1
#     type: days
#     name: "Rol2 Slot 2 Days"
#   - platform: loracover
#     lora_client_id: rol_2
#     slot: 2
#     type: action
#     name: "Rol2 Slot 3 Action"
#   - platform: loracover
#     lora_client_id: rol_2
#     slot: 2
#     type: days
#     name: "Rol2 Slot 3 Days"
