  - platform: template
    name: "Mode Test — window miss rate (node 1)"
    id: rol_1_mt_wmr
    entity_category: diagnostic
    unit_of_measurement: "ppm"
    update_interval: 30s
    accuracy_decimals: 0
    lambda: 'return id(rol_1)->mode_test_summary().valid
                 ? (float) id(rol_1)->mode_test_summary().wmr_ppm
                 : NAN;'
  - platform: template
    name: "Mode Test — phase error p99 (node 1)"
    id: rol_1_mt_phase_p99
    entity_category: diagnostic
    unit_of_measurement: "us"
    update_interval: 30s
    accuracy_decimals: 0
    lambda: 'return id(rol_1)->mode_test_summary().valid
                 ? (float) id(rol_1)->mode_test_summary().phase_p99_us
                 : NAN;'
  - platform: template
    name: "Mode Test — turnaround p99 (node 1)"
    id: rol_1_mt_turnaround_p99
    entity_category: diagnostic
    unit_of_measurement: "us"
    update_interval: 30s
    accuracy_decimals: 0
    lambda: 'return id(rol_1)->mode_test_summary().valid
                 ? (float) id(rol_1)->mode_test_summary().turnaround_p99_us
                 : NAN;'

  # MAC ping, stage 0 of the funnel. pings_offered is the only number in this
  # system that the HUB alone can know.
  - platform: template
    name: "MAC Ping — offered (node 2)"
    id: rol_2_macping_offered
    entity_category: diagnostic
    update_interval: 30s
