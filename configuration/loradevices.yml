#   - platform: loracover
#     lora_client_id: rol_2
#     slot: 3
#     type: days
#     name: "Rol2 Slot 4 Days"
#
# # Target position, only meaningful when a slot's action is `position`.
# --- SLOT-ENTITY SCHEDULE UI (kept for comparison; superseded by `text:`) ---
# Twenty entities per node to express what one line of text says. Left here
# so the two can be judged side by side — re-enable by uncommenting and
# commenting out the text: block below.
# number:
#   - platform: loracover
#     lora_client_id: rol_2
#     slot: 0
#     name: "Rol2 Slot 1 Position"
#   - platform: loracover
#     lora_client_id: rol_2
#     slot: 1
#     name: "Rol2 Slot 2 Position"
#   - platform: loracover
#     lora_client_id: rol_2
#     slot: 2
#     name: "Rol2 Slot 3 Position"
#   - platform: loracover
#     lora_client_id: rol_2
#     slot: 3
#     name: "Rol2 Slot 4 Position"
#
#

# ---- Schedule as one editable line (the alternative being trialled) ---------
#
#   06:00 daily open; 21:45 daily close; 12:00 sat position:40
#
# Two entities instead of twenty. Days accept arbitrary lists (mon,thu) which
# the select could not express, and position is part of the syntax rather than
# a separate control that was missing entirely in the first version.
#
# A rejected edit changes nothing and the status entity says why; the text box
# always shows the canonical form of what the hub actually holds.
text:
  - platform: loracover
    mode: TEXT
    lora_client_id: rol_2
    name: "Rol2 Schedule"
    status:
      name: "Rol2 Schedule Status"
    # No `help:` entity here on purpose. A text_sensor carrying help text is
    # capped at 255 characters and spends an entity on something that is not
    # device state — and HA showed it as unavailable because a READ-ONLY
    # entity marked entity_category: config is semantically wrong
    # (config = changes settings, diagnostic = read-only info).
    #
    # CONFIRMED 2026-08-31: the status text_sensor had the same miscategory
    # and was likewise unavailable in HA. Fixed in the component
    # (loracover/text/__init__.py), so it applies to every node rather than
    # being patched per YAML block. The `help` entity was deleted on a hunch
    # about this; the hunch was right.
    #
    # The syntax lives in docs/schedule-text-syntax.md, and the Lovelace card
    # at the end of that file puts it beside the field in the dashboard —
    # unlimited length, formatted, zero entities.

